# Template tmpfiles for alias "default". Copy/adapt per profile.
# Parent runtime/state dirs are root-owned; access group gets traverse/read only.
# Journal dir is owned by the dedicated UID; its parent remains non-writable by access group.

d /etc/niceeval/docker-profiles                              0755 root root - -
d /run/niceeval                                              0755 root root - -
d /run/niceeval/docker-profiles                              0755 root root - -
d /run/niceeval/docker-profiles/default                      0750 root niceeval-dp-default-access - -
d /var/lib/niceeval                                          0755 root root - -
d /var/lib/niceeval/docker-profiles                          0755 root root - -
d /var/lib/niceeval/docker-profiles/default                  0755 root root - -
d /var/lib/niceeval/docker-profiles/default/home             0750 niceeval-dp-default niceeval-dp-default - -
d /var/lib/niceeval/docker-profiles/default/journal          0750 niceeval-dp-default niceeval-dp-default - -
d /var/lib/niceeval/docker-profiles/default/data             0755 root root - -
