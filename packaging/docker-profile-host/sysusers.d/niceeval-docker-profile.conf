# Template sysusers snippet for one profile alias.
# Replace PROFILE with the alias (e.g. default).
# On NixOS the module creates users declaratively; this file is for generic systemd Linux.
#
# u niceeval-dp-PROFILE   - "NiceEval docker profile PROFILE" /var/lib/niceeval/docker-profiles/PROFILE/home
# g niceeval-dp-PROFILE   -
# g niceeval-dp-PROFILE-access -
# m niceeval-dp-PROFILE niceeval-dp-PROFILE
#
# Concrete example for alias "default":
u niceeval-dp-default         - "NiceEval docker profile default" /var/lib/niceeval/docker-profiles/default/home
g niceeval-dp-default         -
g niceeval-dp-default-access  -
m niceeval-dp-default         niceeval-dp-default
