<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM X · 模拟社交世界</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <nav class="rail" aria-label="主导航">
        <div class="logo">𝕏<span>LAB</span></div>
        <button class="nav active" data-view="feed">⌂ <span>首页</span></button>
        <button class="nav" id="my-profile">◎ <span>个人主页</span></button>
        <div class="mode" id="mode-badge">尚未启动</div>
      </nav>

      <section class="timeline">
        <header class="topbar">
          <div>
            <strong id="page-title">为你推荐</strong>
            <small id="scenario">创建一个由模型驱动的社交世界</small>
          </div>
          <button class="ghost" id="refresh" disabled>刷新动态</button>
        </header>

        <section class="welcome" id="welcome">
          <span class="eyebrow">SIMULATED SOCIAL WORLD</span>
          <h1>进入一条真正会回应你的时间线。</h1>
          <p>人物、主页、推文、配图以及之后的回复与转发，都由所选 provider 生成。</p>
          <form id="world-form">
            <label>你在平台上的名字<input name="playerName" value="小周" maxlength="40" required /></label>
            <label>今天的世界主题<input name="topic" value="AI 时代的城市生活" maxlength="160" required /></label>
            <button type="submit">生成世界</button>
          </form>
          <p class="fixture-note">默认是明确标注的 fixture 模式：内容与 SVG 图片确定可复现，不代表真实模型质量。</p>
        </section>

        <section id="game" hidden>
          <form class="composer" id="post-form">
            <img id="composer-avatar" alt="我的头像" />
            <div>
              <textarea name="intent" maxlength="500" placeholder="告诉模型你想发布什么……" required></textarea>
              <footer><label class="check"><input type="checkbox" name="withImage" /> 生成配图</label><button type="submit">发布</button></footer>
            </div>
          </form>
          <div id="profile-view" hidden></div>
          <div id="feed" aria-live="polite"></div>
        </section>
      </section>

      <aside class="sidebar">
        <div class="panel"><span class="eyebrow">WORLD SIGNAL</span><h2>此刻发生</h2><p id="world-signal">等待创建世界。</p></div>
        <div class="panel"><h2>人物</h2><div id="people"><p class="muted">人物会出现在这里。</p></div></div>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
