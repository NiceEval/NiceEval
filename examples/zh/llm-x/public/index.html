<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <nav class="rail" aria-label="主导航">
        <div class="logo">𝕏</div>
        <button class="nav active" data-view="feed">⌂ <span>首页</span></button>
        <button class="nav" id="my-profile">◎ <span>个人主页</span></button>
      </nav>

      <section class="timeline">
        <header class="topbar">
          <div>
            <strong id="page-title">为你推荐</strong>
            <small id="scenario">正在加载你的时间线</small>
          </div>
          <button class="ghost" id="refresh" disabled>刷新动态</button>
        </header>

        <section class="welcome loading-screen" id="welcome" aria-live="polite">
          <div class="loader" aria-hidden="true"></div>
          <h1 id="loading-title">正在加载</h1>
          <p id="loading-message">正在为你准备时间线……</p>
          <button id="retry-load" type="button" hidden>重试</button>
        </section>

        <section id="game" hidden>
          <form class="composer" id="post-form">
            <img id="composer-avatar" alt="我的头像" />
            <div>
              <textarea name="intent" maxlength="500" placeholder="告诉模型你想发布什么……" required></textarea>
              <footer><label class="check"><input type="checkbox" name="withImage" /> 生成配图</label><button type="submit">发布</button></footer>
            </div>
          </form>
          <div id="profile-view" hidden></div>
          <div id="feed" aria-live="polite"></div>
        </section>
      </section>

      <aside class="sidebar">
        <div class="panel"><h2>此刻发生</h2><p id="world-signal">正在加载……</p></div>
        <div class="panel"><h2>推荐关注</h2><div id="people"><p class="muted">正在加载……</p></div></div>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
