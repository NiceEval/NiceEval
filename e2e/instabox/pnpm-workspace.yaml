packages: []
allowBuilds:
  autoevals: false
  # dockerode only talks to the local daemon over its Unix socket in this scenario.
  '@parcel/watcher': false
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - effect@4.1.3
overrides:
  'dockerode@4>uuid': 11.1.1
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "zod@>=4.0.0 <4.6.7": 4.6.7
  "vite@>=8.0.0 <8.3.5": 8.3.5
