# 独立 workspace root：candidate 与 checkout-local Testkit 注入时解析到本仓库 node_modules，
# 不被父目录 workspace 吸收（见 docs/engineering/testing/architecture/e2e/scenario-repos.md）。
packages: []
allowBuilds:
  autoevals: false
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: false
overrides:
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "zod@>=4.0.0 <4.6.7": 4.6.7
  "vite@>=8.0.0 <8.3.5": 8.3.5
