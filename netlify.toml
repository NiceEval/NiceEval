[build]
  base = "netlify-preview"
  publish = "../netlify-report-preview"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--ignore-scripts"

[context.deploy-preview]
  command = "bash build-report-preview.sh"
  ignore = "bash ./ignore-report-preview.sh"

[context.deploy-preview.environment]
  NICEEVAL_REPORT_PREVIEW = "1"
