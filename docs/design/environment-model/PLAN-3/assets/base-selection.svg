<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620"
     role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">PLAN-3 怎样从 Eval 与 SandboxSpec 选出唯一启动环境</title>
  <desc id="figDesc">Eval 有题目环境时选择匹配的 profile 预制环境，否则现场生成 Eval 自带环境；Eval 无题目环境时选择 SandboxSpec 默认环境，否则使用 Provider 中性环境，四条路径最终汇入唯一 Sandbox Case。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#74747b" />
    </marker>
    <style>
      /* 值来自内建主题 basalt（src/report/theme.ts），改色先改那里 */
      text { fill: #a1a1aa; font-family: ui-sans-serif, -apple-system,
             BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 16px; }
      .title { fill: #ededed; font-size: 20px; font-weight: 600; }
      .label { fill: #ededed; font-size: 18px; font-weight: 600; }
      .note  { fill: #74747b; font-size: 14px; }
      .num   { fill: #ededed; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .mono  { fill: #ededed; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .canvas { fill: #050505; stroke: #262626; stroke-width: 1; }
      .box    { fill: #0b0b0b; stroke: #262626; stroke-width: 1; }
      .box-2  { fill: #111111; stroke: #262626; stroke-width: 1; }

      .rule        { stroke: #262626; stroke-width: 1; fill: none; }
      .rule-strong { stroke: #343434; stroke-width: 1; fill: none; }
      .dash        { stroke: #262626; stroke-width: 1; stroke-dasharray: 4 6; fill: none; }
      .arrow       { stroke: #74747b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }

      .good { fill: #3ddc97; } .bad { fill: #ff6b6b; } .warn { fill: #e8b84a; }
      .good-s { stroke: #3ddc97; } .bad-s { stroke: #ff6b6b; } .warn-s { stroke: #e8b84a; }

      .c0 { fill: #3987e5; } .c1 { fill: #199e70; } .c2 { fill: #c98500; }
      .c3 { fill: #008300; } .c4 { fill: #e66767; } .c5 { fill: #d95926; }
      .c0-s { stroke: #3987e5; } .c1-s { stroke: #199e70; } .c2-s { stroke: #c98500; }
      .c3-s { stroke: #008300; } .c4-s { stroke: #e66767; } .c5-s { stroke: #d95926; }
      .soft { fill-opacity: .16; }
      .dim { fill: #74747b; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1239" height="619" class="canvas" />
  <text x="32" y="48" class="title">PLAN-3 怎样选出唯一启动环境</text>

  <rect x="32.5" y="96.5" width="223" height="103" class="box" />
  <text x="52" y="126" class="label">Eval 声明环境</text>
  <text x="52" y="154">带 environment profile</text>

  <path d="M256 148 H296" class="arrow" />

  <rect x="304.5" y="96.5" width="263" height="103" class="box" />
  <text x="324" y="126" class="label">profile 匹配</text>
  <text x="324" y="154">SandboxSpec 有匹配项吗？</text>

  <path d="M568 148 H592 V116 H616" class="arrow" />
  <path d="M568 148 H592 V236 H616" class="arrow" />

  <rect x="624.5" y="64.5" width="239" height="103" class="box" />
  <text x="644" y="94" class="label">profile 预制环境</text>
  <text x="644" y="122">匹配时直接使用</text>

  <rect x="624.5" y="184.5" width="239" height="103" class="box" />
  <text x="644" y="214" class="label">Eval 自带环境</text>
  <text x="644" y="242">不匹配时现场生成</text>

  <rect x="32.5" y="400.5" width="223" height="103" class="box" />
  <text x="52" y="430" class="label">Eval 没有题目环境</text>
  <text x="52" y="458">不带 environment profile</text>

  <path d="M256 452 H296" class="arrow" />

  <rect x="304.5" y="400.5" width="263" height="103" class="box" />
  <text x="324" y="430" class="label">SandboxSpec 配置默认环境</text>
  <text x="324" y="458">存在吗？</text>

  <path d="M568 452 H592 V412 H616" class="arrow" />
  <path d="M568 452 H592 V532 H616" class="arrow" />

  <rect x="624.5" y="360.5" width="239" height="103" class="box" />
  <text x="644" y="390" class="label">SandboxSpec 默认环境</text>
  <text x="644" y="418">已配置时使用</text>

  <rect x="624.5" y="480.5" width="239" height="103" class="box" />
  <text x="644" y="510" class="label">Provider 中性环境</text>
  <text x="644" y="538">未配置默认环境时使用</text>

  <path d="M864 116 H880 V272 H920" class="arrow" />
  <path d="M864 236 H896 V296 H920" class="arrow" />
  <path d="M864 412 H896 V320 H920" class="arrow" />
  <path d="M864 532 H880 V344 H920" class="arrow" />

  <rect x="928.5" y="248.5" width="279" height="111" class="box" />
  <text x="948" y="278" class="label"><tspan class="good">唯一</tspan> Sandbox Case</text>
  <text x="948" y="306">负责 build、start</text>
  <text x="948" y="330">以及 services ready</text>

  <path d="M1068 360 V408" class="arrow" />

  <rect x="928.5" y="416.5" width="279" height="143" class="box-2" />
  <text x="948" y="446" class="label">start 后运行</text>
  <text x="948" y="474">
    <tspan x="948">Experiment Addon</tspan>
    <tspan x="948" dy="24">Experiment 状态与 turn 前 Fixture</tspan>
    <tspan x="948" dy="24">Agent 安装</tspan>
    <tspan x="948" dy="24">turn 后隐藏判分材料</tspan>
  </text>
</svg>
