  <rect x="552.5" y="216.5" width="31" height="47" class="c0 c0-s soft" />
  <rect x="584.5" y="216.5" width="87" height="47" class="c1 c1-s soft" />
  <rect x="672.5" y="216.5" width="23" height="47" class="c0 c0-s soft" />

  <rect x="704.5" y="216.5" width="7" height="47" class="c2 c2-s soft" />
  <rect x="712.5" y="216.5" width="31" height="47" class="c0 c0-s soft" />
  <rect x="744.5" y="216.5" width="87" height="47" class="c1 c1-s soft" />
  <rect x="832.5" y="216.5" width="23" height="47" class="c0 c0-s soft" />

  <rect x="864.5" y="216.5" width="31" height="47" class="c2 c2-s soft" />

  <path d="M896.5 264 V296" class="dash" />
  <path d="M1112.5 152 V296" class="dash" />
  <path d="M896 288 V296 M896 296 H1112 M1112 296 V288" class="rule good-s" />
  <text x="1004" y="320" class="note good" text-anchor="middle">复用省下的</text>

  <rect x="32.5" y="344.5" width="15" height="15" class="c2 c2-s soft" />
  <text x="56" y="357" class="note">沙箱层 · 每 Sandbox 一次</text>
