  <text x="32" y="258" class="note">一次准备，3 题共用</text>

  <rect x="280.5" y="216.5" width="95" height="47" class="c2 c2-s soft" />

  <rect x="384.5" y="216.5" width="7" height="47" class="c2 c2-s soft" />
  <rect x="392.5" y="216.5" width="31" height="47" class="c0 c0-s soft" />
  <rect x="424.5" y="216.5" width="87" height="47" class="c1 c1-s soft" />
