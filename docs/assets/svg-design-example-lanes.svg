  <rect x="656.5" y="344.5" width="15" height="15" class="c1 c1-s soft" />
  <text x="680" y="357" class="note">test(t) 与判分</text>
  <rect x="880.5" y="344.5" width="7" height="15" class="c2 c2-s soft" />
  <text x="904" y="357" class="note">题间重置 · git reset --hard</text>
</svg>
