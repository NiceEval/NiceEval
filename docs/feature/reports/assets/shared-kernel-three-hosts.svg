<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">共享报告内核扇出三个宿主</title>
  <desc id="figDesc">Record 与 Sample 进入同一个 report 内核完成读数计算与可序列化数据解析，再扇出到 show、view 和用户 React 页面三个宿主。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#74747b" />
    </marker>
    <style>
      /* 值来自 src/view/styles.css 的深色令牌，改色先改那里 */
      text { fill: #a1a1aa; font-family: ui-sans-serif, -apple-system,
             BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 16px; }
      .title { fill: #ededed; font-size: 20px; font-weight: 600; }
      .label { fill: #ededed; font-size: 18px; font-weight: 600; }
      .note  { fill: #74747b; font-size: 14px; }
      .num   { fill: #ededed; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .mono  { fill: #ededed; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .canvas { fill: #050505; stroke: #262626; stroke-width: 1; }
      .box    { fill: #0b0b0b; stroke: #262626; stroke-width: 1; }
      .box-2  { fill: #111111; stroke: #262626; stroke-width: 1; }

      .rule        { stroke: #262626; stroke-width: 1; fill: none; }
      .rule-strong { stroke: #343434; stroke-width: 1; fill: none; }
      .dash        { stroke: #262626; stroke-width: 1; stroke-dasharray: 4 6; fill: none; }
      .arrow       { stroke: #74747b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }

      .good { fill: #3ddc97; } .bad { fill: #ff6b6b; } .warn { fill: #e8b84a; }
      .good-s { stroke: #3ddc97; } .bad-s { stroke: #ff6b6b; } .warn-s { stroke: #e8b84a; }

      .c0 { fill: #3987e5; } .c1 { fill: #199e70; } .c2 { fill: #c98500; }
      .c3 { fill: #008300; } .c4 { fill: #e66767; } .c5 { fill: #d95926; }
      .c0-s { stroke: #3987e5; } .c1-s { stroke: #199e70; } .c2-s { stroke: #c98500; }
      .c3-s { stroke: #008300; } .c4-s { stroke: #e66767; } .c5-s { stroke: #d95926; }
      .soft { fill-opacity: .16; }
      .dim { fill: #74747b; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1239" height="479" class="canvas" />
  <text x="32" y="48" class="title">共享内核：同一份读数与证据，三个呈现位置</text>
  <rect x="32.5" y="96.5" width="191" height="80" class="box" /><text x="52" y="126" class="label mono">Record</text><text x="52" y="150" class="note">事实与证据</text>
  <path d="M224 136 H272" class="arrow" /><rect x="280.5" y="96.5" width="191" height="80" class="box" /><text x="300" y="126" class="label mono">Sample</text><text x="300" y="150" class="note">选择与覆盖</text>
  <path d="M472 136 H520" class="arrow" /><rect x="528.5" y="80.5" width="679" height="112" class="box" /><text x="548" y="110" class="label mono">niceeval/report</text><text x="548" y="142">DataSource compute → resolve → 可序列化 Content</text><text x="548" y="166" class="note">ReportDefinition · pages · 读数 · 证据模型</text>
  <path d="M868 192 V240 H232 M868 240 H620 M868 240 H1032" class="arrow" />
  <rect x="64.5" y="256.5" width="335" height="144" class="box" /><text x="84" y="286" class="label mono">niceeval show</text><text x="84" y="318">report tree · text 面</text><text x="84" y="350" class="note">Agent 使用的终端宿主</text>
  <rect x="452.5" y="256.5" width="335" height="144" class="box" /><text x="472" y="286" class="label mono">niceeval view</text><text x="472" y="318">report tree · web 面</text><text x="472" y="350" class="note">人使用的网页宿主</text>
  <rect x="840.5" y="256.5" width="335" height="144" class="box" /><text x="860" y="286" class="label mono">niceeval/report/react</text><text x="860" y="318">React components</text><text x="860" y="350" class="note">用户自己的页面</text>
  <text x="32" y="448" class="note">宿主拥有交互与布局机器；内核拥有身份、计算与证据边界。</text>
</svg>
