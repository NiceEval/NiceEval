<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Attempt 的 sealed Assertions、Verdict 与 Score 读侧形成</title>
  <desc id="figDesc">Core outcome 与 sealed Assertions 折叠四态 Verdict；Score Attempt 从 points 与 rubric 形成 earned score 和完整度。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#74747b" />
    </marker>
    <style>
      /* 值来自内建主题 basalt（src/report/theme.ts），改色先改那里 */
      text { fill: #a1a1aa; font-family: ui-sans-serif, -apple-system,
             BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 16px; }
      .title { fill: #ededed; font-size: 20px; font-weight: 600; }
      .label { fill: #ededed; font-size: 18px; font-weight: 600; }
      .note  { fill: #74747b; font-size: 14px; }
      .num   { fill: #ededed; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .mono  { fill: #ededed; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .canvas { fill: #050505; stroke: #262626; stroke-width: 1; }
      .box    { fill: #0b0b0b; stroke: #262626; stroke-width: 1; }
      .box-2  { fill: #111111; stroke: #262626; stroke-width: 1; }

      .rule        { stroke: #262626; stroke-width: 1; fill: none; }
      .rule-strong { stroke: #343434; stroke-width: 1; fill: none; }
      .dash        { stroke: #262626; stroke-width: 1; stroke-dasharray: 4 6; fill: none; }
      .arrow       { stroke: #74747b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }

      .good { fill: #3ddc97; } .bad { fill: #ff6b6b; } .warn { fill: #e8b84a; }
      .good-s { stroke: #3ddc97; } .bad-s { stroke: #ff6b6b; } .warn-s { stroke: #e8b84a; }

      .c0 { fill: #3987e5; } .c1 { fill: #199e70; } .c2 { fill: #c98500; }
      .c3 { fill: #008300; } .c4 { fill: #e66767; } .c5 { fill: #d95926; }
      .c0-s { stroke: #3987e5; } .c1-s { stroke: #199e70; } .c2-s { stroke: #c98500; }
      .c3-s { stroke: #008300; } .c4-s { stroke: #e66767; } .c5-s { stroke: #d95926; }
      .soft { fill-opacity: .16; }
      .dim { fill: #74747b; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1239" height="519" class="canvas" />
  <text x="32" y="48" class="title">Attempt 的 Assertions、Verdict 与 Score 读侧形成</text>
  <rect x="360.5" y="88.5" width="519" height="102" class="box" />
  <text x="388" y="122" class="label mono">niceeval.assertions</text>
  <text x="388" y="150">schemaVersion: 4 · sealed entry · criterion · evidence · points</text>
  <text x="388" y="174" class="note">entries 保留声明／展示顺序；entryId 是详情 identity</text>
  <path d="M620 190 V246 H286" class="arrow" />
  <path d="M620 190 V246 H954" class="arrow" />
  <rect x="80.5" y="264.5" width="411" height="112" class="box" />
  <text x="108" y="300" class="label">Verdict（读侧 fold）</text>
  <text x="108" y="328"><tspan class="good">passed</tspan> · <tspan class="bad">failed</tspan> · errored · skipped</text>
  <text x="108" y="354" class="note">Core outcome + sealed Assertions；不另存</text>
  <rect x="748.5" y="264.5" width="411" height="112" class="box" />
  <text x="776" y="300" class="label">Score（读侧汇总）</text>
  <text x="776" y="328">earned score · complete / partial / unavailable</text>
  <text x="776" y="354" class="note">按 points / rubric；不从 Verdict 推导</text>
  <path d="M286 376 V434 H620 V376" class="arrow" />
  <path d="M954 376 V434 H620" class="arrow" />
  <rect x="305.5" y="442.5" width="629" height="48" class="box" />
  <text x="330" y="472" class="note">Score 正常低分仍 passed；execution error 不伪造 0，显示 partial 或 unavailable。</text>
</svg>
