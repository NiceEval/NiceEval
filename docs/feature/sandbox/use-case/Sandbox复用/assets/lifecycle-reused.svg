<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1136" role="img" aria-labelledby="title desc">
  <title id="title">复用 Sandbox 的生命周期</title>
  <desc id="desc">Sandbox 只准备一次并留下题间重置点，之后每条 Attempt 从重置点起跑，只重复 Attempt 生命周期。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#74747b" />
    </marker>
    <style>
      /* 值来自 src/view/styles.css 的深色令牌，改色先改那里 */
      text { fill: #a1a1aa; font-family: ui-sans-serif, -apple-system,
             BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 16px; }
      .title { fill: #ededed; font-size: 20px; font-weight: 600; }
      .label { fill: #ededed; font-size: 18px; font-weight: 600; }
      .note  { fill: #74747b; font-size: 14px; }
      .num   { fill: #ededed; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .mono  { fill: #ededed; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .canvas { fill: #050505; stroke: #262626; stroke-width: 1; }
      .box    { fill: #0b0b0b; stroke: #262626; stroke-width: 1; }
      .box-2  { fill: #111111; stroke: #262626; stroke-width: 1; }

      .rule        { stroke: #262626; stroke-width: 1; fill: none; }
      .rule-strong { stroke: #343434; stroke-width: 1; fill: none; }
      .dash        { stroke: #262626; stroke-width: 1; stroke-dasharray: 4 6; fill: none; }
      .arrow       { stroke: #74747b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }

      .good { fill: #3ddc97; } .bad { fill: #ff6b6b; } .warn { fill: #e8b84a; }
      .good-s { stroke: #3ddc97; } .bad-s { stroke: #ff6b6b; } .warn-s { stroke: #e8b84a; }

      .c0 { fill: #3987e5; } .c1 { fill: #199e70; } .c2 { fill: #c98500; }
      .c3 { fill: #008300; } .c4 { fill: #e66767; } .c5 { fill: #d95926; }
      .c0-s { stroke: #3987e5; } .c1-s { stroke: #199e70; } .c2-s { stroke: #c98500; }
      .c3-s { stroke: #008300; } .c4-s { stroke: #e66767; } .c5-s { stroke: #d95926; }
      .soft { fill-opacity: .16; }
      .dim { fill: #74747b; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="1135" class="canvas" />
  <text x="36" y="48" class="title">复用</text>
  <text x="36" y="75" class="note">Sandbox 准备一次，只循环 Attempt 生命周期</text>

  <rect x="36.5" y="101.5" width="647" height="57" class="c2 c2-s soft" />
  <text x="56" y="126" class="note c2">运行前</text>
  <text x="150" y="126">预制 Agent CLI</text>
  <text x="150" y="148" class="note mono">npm install -g @openai/codex@&lt;version&gt;</text>

  <path d="M360 159V184" class="arrow" />
  <rect x="160.5" y="185.5" width="399" height="53" class="box" />
  <text x="180" y="208" class="label">Experiment.setup</text>
  <text x="180" y="229" class="note">启动 Invocation 级共享资源（可选）</text>

  <path d="M360 239V263" class="arrow" />
  <rect x="36.5" y="264.5" width="647" height="195" class="box" />
  <text x="68" y="294" class="label">Sandbox 准备 · 每 Sandbox 一次</text>
  <line x1="104" y1="312" x2="104" y2="416" class="rule" />
  <circle cx="104" cy="312" r="5" class="c1" />
  <text x="128" y="318" class="mono">createSandbox</text>
  <text x="128" y="336" class="note">Runner 自动</text>
  <circle cx="104" cy="356" r="5" class="c1" />
  <text x="128" y="362" class="mono">SandboxSpec.setup</text>
  <text x="128" y="380" class="note">只准备公共环境，不 clone 任何题目仓库</text>
  <text x="128" y="398" class="note mono">apt-get install ... / corepack enable / warm-cache</text>
  <circle cx="104" cy="416" r="5" class="c1" />
  <text x="128" y="422">建立题间重置点</text>
  <text x="128" y="440" class="note">Runner 自动</text>

  <text x="64" y="531" class="note c0">循环 · 每 Attempt 一次</text>

  <path d="M360 460V537" class="arrow" />
  <rect x="64.5" y="539.5" width="591" height="406" class="box" />
  <text x="692" y="531" class="note c0" text-anchor="end">还有 Attempt：reset</text>

  <line x1="104" y1="555" x2="104" y2="881" class="rule" />
  <circle cx="104" cy="555" r="5" class="c0" />
  <text x="128" y="561" class="mono">ensureLifetime</text>
  <text x="128" y="579" class="note">Provider 确认寿命</text>
  <circle cx="104" cy="599" r="5" class="c1" />
  <text x="128" y="605" class="mono">reset</text>
  <text x="128" y="623" class="note mono">git reset --hard / git clean</text>
  <circle cx="104" cy="643" r="5" class="c0" />
  <text x="128" y="649" class="mono">Eval.setup</text>
  <text x="128" y="667" class="note mono">rm -rf .git .clone</text>
  <text x="128" y="685" class="note mono">git clone &lt;eval-repo-url&gt; .clone &amp;&amp; mv .clone/.git .</text>
  <text x="128" y="703" class="note mono">rm -rf .clone &amp;&amp; git reset &lt;commit&gt; &amp;&amp; pnpm install</text>
  <circle cx="104" cy="729" r="5" class="c0" />
  <text x="128" y="735" class="mono">Agent.setup</text>
  <text x="128" y="753" class="note">鉴权、MCP、skills</text>
  <circle cx="104" cy="773" r="5" class="c2" />
  <text x="128" y="779" class="mono">test(t)</text>
  <text x="128" y="797" class="note mono">t.send(...) / pnpm test</text>
  <circle cx="104" cy="817" r="5" class="c2" />
  <text x="128" y="823">评分与证据收集</text>
  <text x="128" y="841" class="note">Runner 自动</text>
  <circle cx="104" cy="861" r="5" class="dim" />
  <text x="128" y="867" class="mono">Eval.teardown</text>
  <text x="128" y="885" class="note mono">pkill ...</text>
  <circle cx="104" cy="905" r="5" class="dim" />
  <text x="128" y="911" class="mono">Agent.teardown</text>
  <text x="128" y="929" class="note">Adapter 收尾</text>

  <path d="M656 937H680V555H658" class="arrow c0-s" />

  <path d="M360 946V990" class="arrow" />
  <rect x="108.5" y="991.5" width="503" height="53" class="box-2" />
  <text x="132" y="1014" class="mono">SandboxSpec.teardown</text>
  <text x="132" y="1035" class="note">环境级收尾</text>
  <text x="448" y="1014" class="mono">stop</text>
  <text x="448" y="1035" class="note">Runner 自动</text>

  <path d="M360 1045V1049" class="arrow" />
  <rect x="160.5" y="1050.5" width="399" height="53" class="box" />
  <text x="180" y="1073" class="label">Experiment.teardown</text>
  <text x="180" y="1094" class="note">停止 Invocation 级共享资源（可选）</text>
</svg>
