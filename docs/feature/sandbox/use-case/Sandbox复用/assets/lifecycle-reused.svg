<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" role="img" aria-labelledby="title desc">
  <title id="title">复用 Sandbox 的生命周期</title>
  <desc id="desc">Sandbox 只准备一次，题间重置 workdir，只重复 Attempt 生命周期。</desc>
  <defs>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --text: #172033;
        --muted: #526079;
        --line: #64748b;
        --blue: #2563eb;
        --blue-soft: #dbeafe;
        --teal: #0f766e;
        --teal-soft: #ccfbf1;
        --amber: #b45309;
        --amber-soft: #fef3c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #161b22;
          --surface-2: #21262d;
          --text: #e6edf3;
          --muted: #9da7b5;
          --line: #7d8898;
          --blue: #79a8ff;
          --blue-soft: #172a46;
          --teal: #5eead4;
          --teal-soft: #123b38;
          --amber: #fbbf24;
          --amber-soft: #493413;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 28px; font-weight: 750; }
      .subtitle { fill: var(--muted); font-size: 16px; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { fill: var(--muted); font-size: 14px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
      .badge { font-size: 13px; font-weight: 700; letter-spacing: 0; }
      .panel { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
      .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
      .soft { fill: var(--surface-2); }
      .loop { fill: none; stroke: var(--blue); stroke-width: 2; stroke-dasharray: 7 6; }
      .arrow { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
      .loopArrow { fill: none; stroke: var(--blue); stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .timeline { stroke: var(--line); stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="var(--line)" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="var(--blue)" />
    </marker>
  </defs>

  <rect x="1" y="1" width="718" height="868" rx="8" class="panel" />
  <text x="36" y="48" class="title">复用</text>
  <text x="36" y="75" class="subtitle">Sandbox 准备一次，只循环 Attempt 生命周期</text>

  <rect x="36" y="101" width="648" height="58" rx="6" fill="var(--amber-soft)" stroke="var(--amber)" />
  <text x="56" y="126" class="badge" fill="var(--amber)">运行前</text>
  <text x="150" y="126" class="body">预制 Agent CLI</text>
  <text x="150" y="148" class="code">npm install -g @openai/codex@&lt;version&gt;</text>

  <path d="M360 159V184" class="arrow" />
  <rect x="160" y="185" width="400" height="54" rx="6" class="card" />
  <text x="180" y="208" class="section">Experiment.setup</text>
  <text x="180" y="229" class="small">启动 Invocation 级共享资源（可选）</text>

  <path d="M360 239V255" class="arrow" />
  <rect x="64" y="256" width="592" height="158" rx="6" class="card" />
  <rect x="64" y="256" width="12" height="158" rx="6" fill="var(--teal)" />
  <line x1="104" y1="278" x2="104" y2="380" class="timeline" />
  <circle cx="104" cy="278" r="5" fill="var(--teal)" />
  <text x="128" y="284" class="body">createSandbox</text>
  <text x="128" y="302" class="small">Runner 自动</text>
  <circle cx="104" cy="326" r="5" fill="var(--teal)" />
  <text x="128" y="332" class="body">SandboxSpec.setup</text>
  <text x="128" y="350" class="small">只准备公共环境</text>
  <text x="128" y="368" class="code">apt-get install ... / corepack enable / warm-cache</text>
  <circle cx="104" cy="380" r="5" fill="var(--teal)" />
  <text x="128" y="386" class="body">建立题间重置点</text>
  <text x="128" y="404" class="small">Runner 自动</text>

  <rect x="28" y="439" width="664" height="317" rx="8" class="loop" />
  <rect x="48" y="423" width="190" height="32" rx="6" fill="var(--blue-soft)" stroke="var(--blue)" />
  <text x="64" y="444" class="badge" fill="var(--blue)">循环 · 每 ATTEMPT 一次</text>

  <path d="M360 414V465" class="arrow" />
  <rect x="64" y="466" width="592" height="274" rx="6" class="card" />
  <rect x="64" y="466" width="12" height="274" rx="6" fill="var(--blue)" />
  <line x1="104" y1="486" x2="104" y2="710" class="timeline" />
  <circle cx="104" cy="486" r="5" fill="var(--amber)" />
  <text x="128" y="492" class="body">ensureLifetime</text>
  <text x="128" y="508" class="small">Provider 确认寿命</text>
  <circle cx="104" cy="518" r="5" fill="var(--amber)" />
  <text x="128" y="524" class="body">reset</text>
  <text x="128" y="540" class="code">git reset --hard / git clean</text>
  <circle cx="104" cy="542" r="5" fill="var(--teal)" />
  <text x="128" y="548" class="body">Eval.setup</text>
  <text x="128" y="564" class="code">rm -rf .git .clone; git clone &lt;eval-repo-url&gt; .clone</text>
  <text x="128" y="580" class="code">mv .clone/.git .; rm -rf .clone; git reset &lt;commit&gt;; pnpm i</text>
  <circle cx="104" cy="590" r="5" fill="var(--blue)" />
  <text x="128" y="596" class="body">Agent.setup</text>
  <text x="128" y="612" class="small">鉴权、MCP、skills</text>
  <circle cx="104" cy="622" r="5" fill="var(--amber)" />
  <text x="128" y="628" class="body">test(t)</text>
  <text x="128" y="644" class="code">t.send(...) / pnpm test</text>
  <circle cx="104" cy="654" r="5" fill="var(--amber)" />
  <text x="128" y="660" class="body">评分与证据收集</text>
  <text x="128" y="676" class="small">Runner 自动</text>
  <circle cx="104" cy="686" r="5" fill="var(--line)" />
  <text x="128" y="692" class="body">Eval.teardown</text>
  <text x="128" y="708" class="code">pkill ...</text>
  <circle cx="104" cy="716" r="5" fill="var(--line)" />
  <text x="128" y="722" class="body">Agent.teardown</text>
  <text x="128" y="738" class="small">Adapter 收尾</text>

  <path d="M656 724H680V486H658" class="loopArrow" />
  <rect x="506" y="447" width="156" height="27" rx="5" fill="var(--blue-soft)" />
  <text x="518" y="466" class="small" fill="var(--blue)">还有 Attempt：reset</text>

  <path d="M360 756V766" class="arrow" />
  <rect x="120" y="767" width="480" height="96" rx="6" class="card" />
  <line x1="150" y1="779" x2="150" y2="841" class="timeline" />
  <circle cx="150" cy="779" r="5" fill="var(--line)" />
  <text x="174" y="785" class="body">SandboxSpec.teardown</text>
  <text x="174" y="801" class="small">环境级收尾</text>
  <circle cx="150" cy="811" r="5" fill="var(--line)" />
  <text x="174" y="817" class="body">stop</text>
  <text x="174" y="833" class="small">Runner 自动</text>
  <circle cx="150" cy="841" r="5" fill="var(--line)" />
  <text x="174" y="847" class="body">Experiment.teardown</text>
  <text x="174" y="861" class="small">停止 Invocation 级共享资源（可选）</text>
</svg>
