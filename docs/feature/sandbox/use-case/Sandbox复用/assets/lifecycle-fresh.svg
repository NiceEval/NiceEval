<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 876" role="img" aria-labelledby="title desc">
  <title id="title">不复用 Sandbox 的生命周期</title>
  <desc id="desc">每条 Attempt 都创建、准备和停止一个全新 Sandbox。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#74747b" />
    </marker>
    <style>
      /* 值来自 src/view/styles.css 的深色令牌，改色先改那里 */
      text { fill: #a1a1aa; font-family: ui-sans-serif, -apple-system,
             BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 16px; }
      .title { fill: #ededed; font-size: 20px; font-weight: 600; }
      .label { fill: #ededed; font-size: 18px; font-weight: 600; }
      .note  { fill: #74747b; font-size: 14px; }
      .num   { fill: #ededed; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .mono  { fill: #ededed; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .canvas { fill: #050505; stroke: #262626; stroke-width: 1; }
      .box    { fill: #0b0b0b; stroke: #262626; stroke-width: 1; }
      .box-2  { fill: #111111; stroke: #262626; stroke-width: 1; }

      .rule        { stroke: #262626; stroke-width: 1; fill: none; }
      .rule-strong { stroke: #343434; stroke-width: 1; fill: none; }
      .dash        { stroke: #262626; stroke-width: 1; stroke-dasharray: 4 6; fill: none; }
      .arrow       { stroke: #74747b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }

      .good { fill: #3ddc97; } .bad { fill: #ff6b6b; } .warn { fill: #e8b84a; }
      .good-s { stroke: #3ddc97; } .bad-s { stroke: #ff6b6b; } .warn-s { stroke: #e8b84a; }

      .c0 { fill: #3987e5; } .c1 { fill: #199e70; } .c2 { fill: #c98500; }
      .c3 { fill: #008300; } .c4 { fill: #e66767; } .c5 { fill: #d95926; }
      .c0-s { stroke: #3987e5; } .c1-s { stroke: #199e70; } .c2-s { stroke: #c98500; }
      .c3-s { stroke: #008300; } .c4-s { stroke: #e66767; } .c5-s { stroke: #d95926; }
      .soft { fill-opacity: .16; }
      .dim { fill: #74747b; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="875" class="canvas" />
  <text x="36" y="48" class="title">不复用</text>
  <text x="36" y="75" class="note">每条 Attempt 走完一套 Sandbox 生命周期</text>

  <rect x="36.5" y="101.5" width="647" height="57" class="c2 c2-s soft" />
  <text x="56" y="126" class="note c2">运行前</text>
  <text x="150" y="126">预制 Agent CLI</text>
  <text x="150" y="148" class="note mono">npm install -g @openai/codex@&lt;version&gt;</text>

  <path d="M360 159V184" class="arrow" />
  <rect x="160.5" y="185.5" width="399" height="53" class="box" />
  <text x="180" y="208" class="label">Experiment.setup</text>
  <text x="180" y="229" class="note">启动 Invocation 级共享资源（可选）</text>

  <text x="64" y="282" class="note c0">循环 · 每 Attempt 一次</text>

  <path d="M360 239V289" class="arrow" />
  <rect x="64.5" y="290.5" width="591" height="451" class="box" />
  <line x1="104" y1="306" x2="104" y2="718" class="rule" />
  <circle cx="104" cy="306" r="5" class="c1" />
  <text x="128" y="312" class="mono">createSandbox</text>
  <text x="128" y="330" class="note">Runner 自动</text>
  <circle cx="104" cy="350" r="5" class="c1" />
  <text x="128" y="356" class="mono">SandboxSpec.setup</text>
  <text x="128" y="375" class="note mono">git clone &lt;repo-url&gt; . &amp;&amp; git checkout &lt;commit&gt;</text>
  <text x="128" y="393" class="note mono">pnpm install --frozen-lockfile</text>
  <circle cx="104" cy="416" r="5" class="c0" />
  <text x="128" y="422" class="mono">Eval.setup</text>
  <text x="128" y="440" class="note">uploadDirectory / writeFiles</text>
  <circle cx="104" cy="460" r="5" class="c0" />
  <text x="128" y="466" class="mono">Agent.setup</text>
  <text x="128" y="484" class="note">鉴权、MCP、skills</text>
  <circle cx="104" cy="504" r="5" class="c2" />
  <text x="128" y="510" class="mono">test(t)</text>
  <text x="128" y="528" class="note mono">t.send(...) / pnpm test</text>
  <circle cx="104" cy="548" r="5" class="c2" />
  <text x="128" y="554">评分与证据收集</text>
  <text x="128" y="572" class="note">Runner 自动</text>
  <circle cx="104" cy="592" r="5" class="dim" />
  <text x="128" y="598" class="mono">Eval.teardown</text>
  <text x="128" y="616" class="note mono">pkill ...</text>
  <circle cx="104" cy="636" r="5" class="dim" />
  <text x="128" y="642" class="mono">Agent.teardown</text>
  <text x="128" y="660" class="note">Adapter 收尾</text>
  <circle cx="104" cy="680" r="5" class="dim" />
  <text x="128" y="686" class="mono">SandboxSpec.teardown</text>
  <text x="128" y="704" class="note">环境级收尾</text>
  <circle cx="104" cy="718" r="5" class="dim" />
  <text x="128" y="724" class="mono">stop</text>
  <text x="240" y="724" class="note">Runner 自动</text>

  <path d="M656 730H680V306H658" class="arrow c0-s" />
  <text x="692" y="282" class="note c0" text-anchor="end">还有 Attempt：新 Sandbox</text>

  <path d="M360 742V790" class="arrow" />
  <rect x="160.5" y="791.5" width="399" height="53" class="box" />
  <text x="180" y="814" class="label">Experiment.teardown</text>
  <text x="180" y="835" class="note">停止 Invocation 级共享资源（可选）</text>
</svg>
