name: Install Concord CLI
description: Install standalone Concord CLI.
outputs:
  package-root:
    description: Standalone Concord directory.
    value: ${{ steps.install.outputs.package-root }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        # Concord checks Git with GIT_* overrides removed. Container jobs need
        # the current checkout trusted outside checkout's temporary HOME too.
        git config --global --add safe.directory "$(pwd -P)"
        git rev-parse --show-toplevel
        concord_version="0.16.8"
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64) platform=linux-x64 ;;
          Darwin/arm64) platform=darwin-arm64 ;;
          *) platform=linux-x64 ;;
        esac
        concord_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/concord-${concord_version}.XXXXXX")"
        curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 --retry-max-time 600 \
          "https://github.com/CorrectRoadH/Concord/releases/download/v${concord_version}/concord-${concord_version}-${platform}.tar.gz" \
          | tar -xz -C "$concord_root"
        echo "package-root=${concord_root}" >> "$GITHUB_OUTPUT"
        echo "${concord_root}/bin" >> "$GITHUB_PATH"
        "${concord_root}/bin/concord" --version
