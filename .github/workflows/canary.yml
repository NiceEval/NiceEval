name: Canary

# 从 main 一键发 canary 预发布版:Actions 页面点 Run workflow 即可,不需要本地任何操作。
#
# 版本号自动算:npm 上 latest 的下一个 patch + `-canary.<run_number>`(如 0.10.3-canary.7),
# run_number 单调递增,不会撞号。发布链(写版本号 → build → typecheck → publish)与 release.yml
# 完全同构,dist-tag 按同一条规则落到 canary;发完再打 git tag `v<version>` 推回仓库——
# 消费侧(NiceEval-Eval 的 pin-candidate)靠这个 tag 取按版本存档的 INIT.md,缺了它
# canary 就评不了。
#
# tag 用默认 GITHUB_TOKEN 推，GitHub 不会用它级联触发 release.yml——这避免同一版本被
# 发布两次。完成发布后显式 dispatch Release 的只读核验 job，因此每个 tag 仍有可见日志。
#
# 触发:每天定时发一版(schedule),外加 workflow_dispatch 允许随时手动补发。不按 push main
# 发是刻意的——eval 只是偶尔对比 canary,每次 push 都发一版只会在 npm 上刷版本号噪声。定时
# 发让 main 的最新快照每天有一版可评,而 run_number 单调递增保证不撞号。

on:
  schedule:
    - cron: "0 0 * * *" # 每天 00:00 UTC 发一版 canary
  workflow_dispatch:

permissions:
  actions: write # dispatch Release 核验日志需要
  contents: write # 推 tag、创建 release 需要
  id-token: write # npm provenance 需要

jobs:
  publish:
    name: Publish canary to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Compute canary version
        id: version
        run: |
          LATEST="$(npm view niceeval version)"
          BASE="$(node -p "const [a,b,c]='$LATEST'.split('.').map(Number); [a,b,c+1].join('.')")"
          VERSION="$BASE-canary.${{ github.run_number }}"
          echo "Canary version: $VERSION (npm latest: $LATEST)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:report

      - name: Typecheck
        run: pnpm run typecheck

      - name: Publish
        run: pnpm publish --no-git-checks --provenance --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push tag, create GitHub prerelease, and record Release log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --prerelease
          gh workflow run release.yml --ref main -f tag="$TAG"
