name: Canary

# npm Trusted Publishing identifies the calling workflow. Dispatch release.yml
# at the tag so the existing release.yml trust binding and exact ref are preserved.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.previous.outputs.skip }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the default-branch commit for this run
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with the newest Canary tag
        id: previous
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*-canary.*' |
            awk -F. '/^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$/ { print $NF, $0 }' |
            sort -k1,1nr | awk 'NR == 1 { print $2 }')"
          if [ -n "$previous" ] && [ "$(git rev-parse "${previous}^{commit}")" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$previous already points to $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.previous.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Push Canary tag
        id: tag
        if: steps.previous.outputs.skip == 'false'
        run: |
          set -euo pipefail
          latest="$(npm view niceeval@latest version)"
          if ! [[ "$latest" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Expected a stable version from npm latest, got $latest"
            exit 1
          fi
          tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-canary.$GITHUB_RUN_NUMBER"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
    outputs:
      url: ${{ steps.dispatch.outputs.url }}
      conclusion: ${{ steps.wait.outputs.conclusion }}
      publish: ${{ steps.wait.outputs.publish }}
      live-e2e: ${{ steps.wait.outputs.live-e2e }}
      live-properties: ${{ steps.wait.outputs.live-properties }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the Release workflow at the Canary tag
        id: dispatch
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref="$TAG" -f 'inputs[tag]='"$TAG")"
          run_id="$(jq -er '.workflow_run_id' <<< "$response")"
          url="$(jq -er '.html_url' <<< "$response")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "[Release $TAG]($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the dispatched Release result
        id: wait
        env:
          RELEASE_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          while true; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
            if [ "$(jq -r '.status' <<< "$result")" = completed ]; then
              conclusion="$(jq -er '.conclusion' <<< "$result")"
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 30
          done
          jobs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?filter=latest&per_page=100")"
          job_result() {
            jq -r --arg name "$1" 'first(.[].jobs[] | select(.name == $name) | .conclusion) // "unknown"' <<< "$jobs"
          }
          publish="$(job_result 'Publish exact tarball to npm')"
          {
            echo "publish=$publish"
            echo "live-e2e=$(job_result 'Live E2E / e2e gate')"
            echo "live-properties=$(job_result 'Live properties / Live Provider properties')"
          } >> "$GITHUB_OUTPUT"
          test "$publish" = success

  report:
    needs: [prepare, release]
    if: >-
      !cancelled() && needs.prepare.outputs.skip != 'true'
      && (needs.prepare.result == 'failure'
      || needs.release.result == 'success'
      || (needs.release.result == 'failure' && needs.release.outputs.conclusion != 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Nightly release issue
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.release.outputs.publish || (needs.release.result == 'skipped' && 'skipped' || 'unknown') }}
          LIVE_E2E_RESULT: ${{ needs.release.outputs.live-e2e || 'unknown' }}
          LIVE_PROPERTIES_RESULT: ${{ needs.release.outputs.live-properties || 'unknown' }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
        run: |
          set -euo pipefail
          title='Nightly release failing'
          run_url="${RELEASE_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          body="$(printf '%s\n' "- npm publish: $PUBLISH_RESULT" "- Live E2E: $LIVE_E2E_RESULT" "- Live Provider properties: $LIVE_PROPERTIES_RESULT" '' "[Workflow run]($run_url)")"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          issue="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            | jq -s -r --arg title "$title" 'add | first(.[] | select(.title == $title and (has("pull_request") | not))).number // empty')"
          if [ "$PUBLISH_RESULT" = success ] && [ "$LIVE_E2E_RESULT" = success ] && [ "$LIVE_PROPERTIES_RESULT" = success ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
