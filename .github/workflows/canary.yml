name: Canary

# 从 main 一键发 canary 预发布版:Actions 页面点 Run workflow 即可,不需要本地任何操作。
#
# 版本号自动算:npm 上 latest 的下一个 patch + `-canary.<run_number>`(如 0.10.3-canary.7),
# run_number 单调递增,不会撞号。本 workflow 只打 git tag `v<version>` 并 dispatch
# release.yml；build、精确制品校验、npm publish 和 GitHub Release 全部由那条唯一
# 发布链负责。E2E 由独立 workflow 持续运行，不在 canary 发版时重跑。
# 消费侧(NiceEval-Eval 的 pin-candidate)靠这个 tag 取按版本存档的 INIT.md,缺了它
# canary 就评不了。
#
# tag 用默认 GITHUB_TOKEN 推，GitHub 不会用它级联触发 release.yml，所以
# 推送后显式 dispatch；只会进入一次发布链。
#
# 触发:每天定时发一版(schedule),外加 workflow_dispatch 允许随时手动补发。不按 push main
# 发是刻意的——eval 只是偶尔对比 canary,每次 push 都发一版只会在 npm 上刷版本号噪声。定时
# 发让 main 的最新快照每天有一版可评,而 run_number 单调递增保证不撞号。

on:
  schedule:
    - cron: "0 0 * * *" # 每天 00:00 UTC 发一版 canary
  workflow_dispatch:

permissions:
  actions: write # dispatch 唯一 Release 发布链
  contents: write # 推 tag 需要

jobs:
  dispatch-release:
    name: Tag and dispatch canary release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compute canary version
        id: version
        run: |
          LATEST="$(npm view niceeval version)"
          BASE="$(node -p "const [a,b,c]='$LATEST'.split('.').map(Number); [a,b,c+1].join('.')")"
          VERSION="$BASE-canary.${{ github.run_number }}"
          echo "Canary version: $VERSION (npm latest: $LATEST)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push tag and dispatch the release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          remote_target="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_target" ]; then
            if [ "$remote_target" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points to $remote_target instead of this canary commit $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG already points to this canary commit; continuing the idempotent dispatch"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
          {
            echo "## Canary release dispatched"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Publisher: \`release.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"
