name: Property tests

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-tests-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'schedule' }}
  cancel-in-progress: false

jobs:
  property-suite:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/property-suite.yml
    permissions:
      contents: read
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  nightly-status:
    needs: [property-suite]
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (failure() || success())
    uses: ./.github/workflows/nightly-status.yml
    permissions:
      issues: write
    with:
      suite: property-tests
      failed: ${{ contains(needs.*.result, 'failure') }}
