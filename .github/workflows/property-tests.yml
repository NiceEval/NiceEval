name: Property tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-suite:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/property-suite.yml
    permissions:
      contents: read
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
