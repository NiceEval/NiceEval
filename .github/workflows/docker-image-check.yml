name: Docker image checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  self-check:
    name: Check niceeval/${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claude-code
          - image: codex
          - image: bub
          - image: opencode
          - image: hermes
          - image: openclaw
          - image: omp
          - image: deepseek-harness
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve baseline version
        id: version
        env:
          AGENT: ${{ matrix.image }}
        # 版本号的单源是 src/agents/coding-cli-versions.ts，workflow 不再拼一份自己的。
        run: |
          AGENT_VERSION=$(node -e '
            import("./packages/niceeval/src/agents/coding-cli-versions.ts").then((m) => {
              process.stdout.write(m.AGENT_BASELINE_VERSION[process.env.AGENT]);
            });
          ')
          BUN_VERSION=$(node -e '
            import("./packages/niceeval/src/agents/coding-cli-versions.ts").then((m) => {
              process.stdout.write(m.DEFAULT_BUN_VERSION);
            });
          ')
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for self-check
        uses: docker/build-push-action@v7
        with:
          context: sandbox/docker
          target: ${{ matrix.image }}
          load: true
          platforms: linux/amd64
          tags: niceeval/${{ matrix.image }}:selfcheck
          build-args: |
            OMP_VERSION=${{ steps.version.outputs.agent_version }}
            BUN_VERSION=${{ steps.version.outputs.bun_version }}
            DEEPSEEK_HARNESS_VERSION=${{ steps.version.outputs.agent_version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Assert baseline tool surface
        # 跨 provider 基线工具面契约(docs/feature/sandbox/library/prebuilt-environments.md
        # 「跨 provider 基线工具面」):包管理器只保证 npm 与 corepack,不预装 yarn 实体;
        # python3 保证存在;/usr/local/bin 与 /usr/local/lib/node_modules 对运行用户
        # (镜像默认 USER,即 node)可写。corepack enable 断言放最后——
        # 它会在 /usr/local/bin 落一个 yarn shim,顺序早于「无 yarn」检查会把后者测红。
        run: |
          docker run --rm niceeval/${{ matrix.image }}:selfcheck sh -c '
            if command -v yarn >/dev/null 2>&1; then
              echo "yarn must not be preinstalled in the official baseline, found: $(command -v yarn)" >&2
              exit 1
            fi
            python3 --version
            corepack enable && yarn --version
          '

      - name: Assert non-root Node runtime switching
        run: |
          docker run --rm niceeval/${{ matrix.image }}:selfcheck sh -ec '
            test "$(id -u)" != 0
            npm install -g --prefix /usr/local n@10.2.0
            n 22.13.0
            test "$(node --version)" = "v22.13.0"
            npm --version
          '
