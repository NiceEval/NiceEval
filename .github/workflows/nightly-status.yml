name: Nightly status

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      failed:
        required: true
        type: boolean

permissions: {}

jobs:
  issue:
    name: Update Nightly CI issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: nightly-ci-issue
      cancel-in-progress: false
    steps:
      - name: Record suite result
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ inputs.suite }}
          FAILED: ${{ inputs.failed }}
        run: |
          set -euo pipefail
          title='Nightly CI failing'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            | jq -s -r --arg title "$title" 'add | first(.[] | select(.title == $title and (has("pull_request") | not))).number // empty')"
          if [ "$FAILED" = 'true' ]; then
            body="$(printf '%s failed. %s\n\n<!-- nightly-ci:%s:failure -->' "$SUITE" "$run_url" "$SUITE")"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            body="$(printf '%s passed. %s\n\n<!-- nightly-ci:%s:success -->' "$SUITE" "$run_url" "$SUITE")"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            # Only bot records count. Keep the issue open until every reported suite recovers.
            unresolved="$({
              gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '[.]'
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100"
            } \
              | jq -s '
                add
                | map(select(.user.login == "github-actions[bot]"))
                | map(.body | match("<!-- nightly-ci:(e2e|property-tests):(failure|success) -->").captures | map(.string))
                | reduce .[] as [$suite, $status] ({}; .[$suite] = $status)
                | any(.[]; . == "failure")
              ')"
            if [ "$unresolved" = 'false' ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY"
            fi
          fi
