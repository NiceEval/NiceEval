name: Publish Docker image

# Docker Hub 是 NiceEval 预制 coding-agent 环境的公开分发处。镜像的版本跟着它装的那个
# Agent 走，不跟 niceeval 的 release：发布由基线配方变更触发，niceeval 发一个 patch 不会
# 重建没变的镜像。已发布的 tag 不原地覆盖——想重建就先 bump 配方修订号；同一次 push
# 里未变的 Agent 直接跳过，不影响其它 Agent 的发布。
on:
  push:
    branches:
      - main
    paths:
      - "sandbox/docker/**"
      - "src/agents/coding-cli-versions.ts"
      - "src/agents/bub-install-spec.ts"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:
    inputs:
      overwrite:
        description: "覆盖已发布的同名 tag（只在确认制品未被引用时使用）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish niceeval/${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claude-code
          - image: codex
          - image: bub
          - image: opencode
          - image: hermes
          - image: openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve baseline version
        id: version
        env:
          AGENT: ${{ matrix.image }}
        # 版本号的单源是 src/agents/coding-cli-versions.ts，workflow 不再拼一份自己的。
        run: |
          VERSION=$(node -e '
            import("./src/agents/coding-cli-versions.ts").then((m) => {
              process.stdout.write(m.agentBaselineVersionTag(process.env.AGENT));
            });
          ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "已解析 niceeval/$AGENT:$VERSION"

      - name: Decide whether to publish
        id: gate
        env:
          IMAGE: niceeval/${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          OVERWRITE: ${{ inputs.overwrite }}
        # 同一个 tag 在不同时间指向不同环境会让"同一配置"的跑分失去可比性。
        # 未要求 overwrite 且 tag 已存在时跳过本 Agent，让同次 push 里其它新 Agent 继续发。
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/$IMAGE/tags/$VERSION")
          if [[ "$OVERWRITE" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "overwrite 开启，继续构建 $IMAGE:$VERSION（HTTP $STATUS）。"
            exit 0
          fi
          if [[ "$STATUS" == "200" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION 已发布，跳过。配方变了就 bump AGENT_BASELINE_RECIPE_REVISION。"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION 尚未发布（HTTP $STATUS），继续构建。"

      - name: Log in to Docker Hub
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: niceeval
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image for self-check
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: sandbox/docker
          target: ${{ matrix.image }}
          load: true
          platforms: linux/amd64
          tags: niceeval/${{ matrix.image }}:selfcheck
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Assert baseline tool surface
        if: steps.gate.outputs.publish == 'true'
        # 跨 provider 基线工具面契约(docs/feature/sandbox/library/prebuilt-environments.md
        # 「跨 provider 基线工具面」):包管理器只保证 npm 与 corepack,不预装 yarn 实体;
        # python3 保证存在。两条不过,配方不发布。
        run: |
          docker run --rm niceeval/${{ matrix.image }}:selfcheck sh -c '
            if command -v yarn >/dev/null 2>&1; then
              echo "yarn must not be preinstalled in the official baseline, found: $(command -v yarn)" >&2
              exit 1
            fi
            python3 --version
          '

      - name: Build and push multi-platform image
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: sandbox/docker
          target: ${{ matrix.image }}
          push: true
          platforms: linux/amd64,linux/arm64
          # latest 跟随该 Agent 的最新基线，只适合交互试用；CI 钉版本 tag 或 digest。
          tags: |
            niceeval/${{ matrix.image }}:${{ steps.version.outputs.version }}
            niceeval/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
