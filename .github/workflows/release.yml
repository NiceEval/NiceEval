name: Release

# 发版到 npm 只有一条路：以 v* 标签触发本 workflow。普通发版由 tag push
# 触发；Canary 用 GITHUB_TOKEN 推 tag 后显式 workflow_dispatch（token push 不会级联
# 触发 workflow）。CI 从标签名解析版本，在 runner 本地写入 package.json
# （不写回仓库），只 pack 一次，再发布同一份 tgz。不要求 main 预先提交版本号变更。
#
# 前置:在仓库 Settings → Secrets → Actions 配好 NPM_TOKEN(npm automation token)。
# 根 install 只准备工具依赖，不触发 prepare。后面的 `pnpm pack` 是唯一构建点：
# prepare 生成 dist/** 与随包 INDEX.md。最后的 `npm publish <tgz>` 发布同一份
# 已校验制品，不再重建或重新 pack；E2E 由独立 workflow 持续运行，不在发版时重跑。

on:
  push:
    tags:
      - "v*"
  # Canary 由 GITHUB_TOKEN 推 tag；GitHub 不会让那次 push 再触发本工作流，
  # 所以 Canary 显式 dispatch 这条唯一发布链。
  workflow_dispatch:
    inputs:
      tag:
        description: "要验证并发布的已存在 vX.Y.Z 标签"
        required: true
        type: string

permissions:
  contents: write # 创建 release 需要
  id-token: write # npm provenance 需要

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      candidate_sha256: ${{ steps.pack.outputs.candidate_sha256 }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Apply release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag 必须是 vX.Y.Z（可带预发布标识），收到: $RELEASE_TAG"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::release workflow 必须以同一 tag ref 运行: expected=refs/tags/$RELEASE_TAG actual=$GITHUB_REF"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          npm --prefix packages/niceeval version "$VERSION" --no-git-tag-version --allow-same-version
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      # 发版闸门只看包自身对不对:类型检查 + docs/memory 守护。docs-site 的 mint 校验
      # (lint:docs-site)不进这条链——文档站单独部署,一条断链不该拦住 npm publish;
      # 随包 INDEX.md 的生成失败由 pack 里的 prepare/build:index 直接报错。
      - name: Lint docs
        run: pnpm run lint:docs

      - name: Pack exact versioned candidate once
        id: pack
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/niceeval-release-candidate"
          mkdir -p "$bundle"
          candidate="${bundle}/niceeval-candidate.tgz"
          pnpm e2e pack --out "$candidate" | tee "${bundle}/candidate-pack.json"
          candidate_sha256="$(jq -r '.sha256' "${bundle}/candidate-pack.json")"
          actual="$(sha256sum "$candidate" | awk '{print $1}')"
          if ! [[ "$candidate_sha256" =~ ^[0-9a-f]{64}$ ]] || [ "$actual" != "$candidate_sha256" ]; then
            echo "::error::release candidate SHA-256 mismatch: pack=${candidate_sha256:-<empty>} actual=$actual"
            exit 1
          fi
          printf '%s\n' "$candidate_sha256" > "${candidate}.sha256"
          echo "candidate_sha256=$candidate_sha256" >> "$GITHUB_OUTPUT"
          echo "[release] candidate sha256=$candidate_sha256"

      - name: Upload exact release candidate
        uses: actions/upload-artifact@v7
        with:
          name: niceeval-release-candidate
          path: ${{ runner.temp }}/niceeval-release-candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish exact tarball to npm
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download exact release candidate
        uses: actions/download-artifact@v8
        with:
          name: niceeval-release-candidate
          path: ${{ runner.temp }}/niceeval-release-candidate

      - name: Publish exact tarball
        env:
          EXPECTED_SHA256: ${{ needs.prepare-release.outputs.candidate_sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/niceeval-release-candidate"
          candidate="${bundle}/niceeval-candidate.tgz"
          actual="$(sha256sum "$candidate" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::publish candidate SHA-256 mismatch: expected=$EXPECTED_SHA256 actual=$actual"
            exit 1
          fi
          expected_integrity="$(jq -r '.integrity' "${bundle}/candidate-pack.json")"
          if ! [[ "$expected_integrity" =~ ^sha512-[A-Za-z0-9+/=]+$ ]]; then
            echo "::error::candidate pack metadata has no valid sha512 integrity"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi

          view_json="${RUNNER_TEMP}/published-integrity.json"
          view_error="${RUNNER_TEMP}/published-integrity.err"
          published_integrity=
          if npm view "niceeval@$VERSION" dist.integrity --json > "$view_json" 2> "$view_error"; then
            published_integrity="$(jq -r 'if type == "string" then . else empty end' "$view_json")"
            if [ "$published_integrity" != "$expected_integrity" ]; then
              echo "::error::niceeval@$VERSION already exists with different bytes"
              exit 1
            fi
            echo "niceeval@$VERSION already contains the exact tarball; continuing the idempotent release"
          elif grep -q 'E404' "$view_error"; then
            echo "Publishing niceeval@$VERSION sha256=$actual with dist-tag $DIST_TAG"
            npm publish "$candidate" --provenance --access public --tag "$DIST_TAG"
          else
            echo "::error::could not determine whether niceeval@$VERSION is already published"
            sed -n '1,80p' "$view_error" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; exact npm candidate was checked"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $PRERELEASE_FLAG
          fi
