name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version 缺省时 pnpm/action-setup 读取根 package.json 的 packageManager，
      # 不在 workflow 重复版本真源。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 产品站构建会消费 report 的预编译运行时；干净 checkout 不能依赖
      # install 生命周期或旧 dist 偶然留下的产物。
      - name: Build package runtime
        run: pnpm run build:package

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build product site
        run: pnpm run site:build

  docs-lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version 缺省时 pnpm/action-setup 读取根 package.json 的 packageManager，
      # 不在 workflow 重复版本真源。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # mint CLI 要 LTS Node；这个 job 与 package job 并行，慢在拉 mint@latest 上，
      # 不拖住代码侧反馈。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs and docs-site
        run: pnpm lint
