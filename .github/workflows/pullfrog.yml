# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Keep inspection and reporting in one invocation. On a successful review
      # with a stable HEAD and an unambiguous marker state, repository instructions
      # create or edit one marked final-state comment and forbid all other output.
      - name: Inspect pull request and update final review state
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
          model: openai/gpt-5.6-sol
          progress_comments: disabled
          push: disabled
          shell: disabled
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
