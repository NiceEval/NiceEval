# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Pullfrog Console dispatch payload; used only to identify the target PR
        required: true
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  transport-canary:
    name: Verify large result script transport
    if: ${{ inputs.name == 'transport-canary' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Produce a schema-legal result above the environment boundary
        id: producer
        shell: node {0}
        run: |
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const reviewBody = `quotes: "'\\; expression: $` + "{{not-an-expression}}; "
            + "你".repeat(59_950);
          const raw = JSON.stringify({
            pull_number: 52,
            head_sha: "0123456789abcdef0123456789abcdef01234567",
            review_body: reviewBody,
          });
          const bytes = Buffer.byteLength(raw, "utf8");
          if (reviewBody.length > 60_000 || bytes <= 128 * 1024 || bytes > 720_256) {
            throw new Error(`Canary fixture violates the production boundary: ${bytes} bytes`);
          }
          const sha256 = crypto.createHash("sha256").update(raw).digest("hex");
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `result<<PULLFROG_TRANSPORT_CANARY\n${raw}\nPULLFROG_TRANSPORT_CANARY\n`
              + `bytes=${bytes}\nsha256=${sha256}\n`,
          );
      - name: Consume the result through the production script boundary
        shell: node --input-type=commonjs {0}
        run: |
          const crypto = require("node:crypto");

          const raw = ${{ toJSON(steps.producer.outputs.result) }};
          const expectedBytes = Number(${{ toJSON(steps.producer.outputs.bytes) }});
          const expectedSha256 = ${{ toJSON(steps.producer.outputs.sha256) }};
          const bytes = Buffer.byteLength(raw, "utf8");
          const sha256 = crypto.createHash("sha256").update(raw).digest("hex");
          const parsed = JSON.parse(raw);
          if (
            bytes !== expectedBytes
            || sha256 !== expectedSha256
            || typeof parsed.review_body !== "string"
            || parsed.review_body.length > 60_000
            || bytes <= 128 * 1024
            || bytes > 720_256
          ) {
            throw new Error(`Large result changed across script transport: ${bytes} ${sha256}`);
          }

  context:
    name: Lock pull request audit context
    if: ${{ inputs.name != 'transport-canary' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_number: ${{ steps.target.outputs.pull_number }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      review_prompt_b64: ${{ steps.target.outputs.review_prompt_b64 }}
    steps:
      - name: Resolve locked PR metadata and base review rules
        id: target
        uses: actions/github-script@v9
        env:
          PULLFROG_DISPATCH: ${{ inputs.prompt }}
        with:
          script: |
            const raw = process.env.PULLFROG_DISPATCH;
            let payload;
            try {
              payload = JSON.parse(raw);
            } catch {
              throw new Error("Pullfrog dispatch prompt must be valid JSON");
            }

            const pullNumber = payload?.event?.issue_number;
            if (payload?.["~pullfrog"] !== true || payload?.event?.is_pr !== true) {
              throw new Error("Pullfrog dispatch does not identify a pull request event");
            }
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              throw new Error("Pullfrog dispatch has an invalid issue_number");
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            })).data;
            if (pull.state !== "open") {
              throw new Error("Pullfrog dispatch targets a closed pull request");
            }

            const assertSha = (value, name) => {
              if (typeof value !== "string" || !/^[0-9a-f]{40}$/.test(value)) {
                throw new Error(`GitHub pull request metadata has an invalid ${name}`);
              }
              return value;
            };
            // Do not use eventInstructions or an event head SHA from the Console
            // payload. This GitHub API snapshot is the sole run binding.
            const baseSha = assertSha(pull.base.sha, "base SHA");
            const headSha = assertSha(pull.head.sha, "head SHA");

            const source = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/pullfrog-review-prompt.md",
              ref: baseSha,
            });
            if (Array.isArray(source.data) || source.data.type !== "file" || source.data.encoding !== "base64") {
              throw new Error("Base pullfrog review prompt is not a readable base64 file");
            }

            const markdown = Buffer.from(source.data.content, "base64").toString("utf8");
            const promptHeadings = [...markdown.matchAll(/^## Prompt[ \t]*\r?$/gm)];
            if (promptHeadings.length !== 1 || promptHeadings[0].index === undefined) {
              throw new Error("Base pullfrog review prompt must contain exactly one ## Prompt heading");
            }
            const prompt = markdown
              .slice(promptHeadings[0].index + promptHeadings[0][0].length)
              .replace(/^\r?\n/, "");
            if (!prompt.trim() || prompt.includes("\u0000")) {
              throw new Error("Base pullfrog review prompt body is empty or invalid");
            }

            const placeholders = [
              "{{PULL_NUMBER}}",
              "{{BASE_SHA}}",
              "{{HEAD_SHA}}",
              "{{AUTHORITATIVE_DIFF_PATH}}",
            ];
            for (const placeholder of placeholders) {
              if (!prompt.includes(placeholder)) {
                throw new Error(`Base pullfrog review prompt is missing ${placeholder}`);
              }
            }
            const unknownPlaceholders = prompt.match(/\{\{[^{}]+\}\}/g) ?? [];
            if (unknownPlaceholders.some((placeholder) => !placeholders.includes(placeholder))) {
              throw new Error("Base pullfrog review prompt contains an unknown workflow placeholder");
            }

            const reviewPromptB64 = Buffer.from(prompt, "utf8").toString("base64");
            if (reviewPromptB64.length > 900_000) {
              throw new Error("Base pullfrog review prompt is too large for a job output");
            }

            core.setOutput("pull_number", String(pullNumber));
            core.setOutput("base_sha", baseSha);
            core.setOutput("head_sha", headSha);
            core.setOutput("review_prompt_b64", reviewPromptB64);

  review:
    name: Inspect locked pull request state
    needs: context
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout locked pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize authoritative review diff
        shell: bash
        env:
          BASE_SHA: ${{ needs.context.outputs.base_sha }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --merge-base "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/pullfrog-current-state-audit.diff"
      - name: Build plain current-state audit prompt
        id: prompt
        uses: actions/github-script@v9
        env:
          PULL_NUMBER: ${{ needs.context.outputs.pull_number }}
          BASE_SHA: ${{ needs.context.outputs.base_sha }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          REVIEW_PROMPT_B64: ${{ needs.context.outputs.review_prompt_b64 }}
        with:
          script: |
            const fs = require("node:fs/promises");
            const path = require("node:path");

            const pullNumber = Number(process.env.PULL_NUMBER);
            const baseSha = process.env.BASE_SHA;
            const headSha = process.env.HEAD_SHA;
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              throw new Error("Locked pull request number is invalid");
            }
            for (const [name, value] of [["base SHA", baseSha], ["head SHA", headSha]]) {
              if (typeof value !== "string" || !/^[0-9a-f]{40}$/.test(value)) {
                throw new Error(`Locked ${name} is invalid`);
              }
            }

            const template = Buffer.from(process.env.REVIEW_PROMPT_B64 ?? "", "base64").toString("utf8");
            if (!template.trim() || template.includes("\u0000")) {
              throw new Error("Base pullfrog review prompt body is empty or invalid");
            }
            const diffPath = path.join(process.env.RUNNER_TEMP, "pullfrog-current-state-audit.diff");
            const replacements = {
              "{{PULL_NUMBER}}": String(pullNumber),
              "{{BASE_SHA}}": baseSha,
              "{{HEAD_SHA}}": headSha,
              "{{AUTHORITATIVE_DIFF_PATH}}": diffPath,
            };
            let prompt = template;
            for (const [placeholder, value] of Object.entries(replacements)) {
              if (!prompt.includes(placeholder)) {
                throw new Error(`Base pullfrog review prompt is missing ${placeholder}`);
              }
              prompt = prompt.replaceAll(placeholder, value);
            }
            if (/\{\{[^{}]+\}\}/.test(prompt)) {
              throw new Error("Plain Pullfrog audit prompt has an unresolved placeholder");
            }

            const promptPath = path.join(process.env.RUNNER_TEMP, "pullfrog-current-state-audit.md");
            await fs.writeFile(promptPath, prompt, { encoding: "utf8", mode: 0o600 });
            core.setOutput("path", promptPath);
      # The action receives a plain, repository-controlled Task prompt. The
      # Console JSON stays confined to the context job and is never agent input.
      - name: Audit locked pull request state
        id: pullfrog
        uses: pullfrog/pullfrog@v0
        with:
          prompt_file: ${{ steps.prompt.outputs.path }}
          model: openai/gpt-5.6-sol
          progress_comments: disabled
          push: disabled
          shell: disabled
          # UTF-8 artifact contract (shared by schema, stage, and publish):
          # review_body maxLength is 60000 Unicode code points (JSON Schema).
          # The most verbose legal JSON encoding of one code point is a
          # surrogate-pair escape (\uHHHH\uLLLL = 12 UTF-8 bytes). The
          # three-field envelope is bounded by pull_number maximum and the
          # 40-hex head_sha, and fits in 256 bytes even when pretty-printed.
          # Stage and publish therefore fail-closed at 60000 * 12 + 256 =
          # 720256 UTF-8 bytes so any schema-legal result can be published.
          output_schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["pull_number", "head_sha", "review_body"],
              "properties": {
                "pull_number": { "type": "integer", "minimum": 1, "maximum": 9007199254740991 },
                "head_sha": { "type": "string", "pattern": "^[0-9a-f]{40}$" },
                "review_body": { "type": "string", "minLength": 1, "maxLength": 60000 }
              }
            }
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Stage structured review result
        # Actions renders this run block to a temporary file before invoking
        # node, so the full result never crosses an environment, action-input,
        # or process-argument boundary.
        shell: node --input-type=commonjs {0}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          // Keep in sync with the publish job and the schema comment above.
          const REVIEW_RESULT_MAX_UTF8_BYTES = 720_256;

          const raw = ${{ toJSON(steps.pullfrog.outputs.result) }};
          const rawUtf8Bytes = Buffer.byteLength(raw, "utf8");
          if (rawUtf8Bytes < 1 || rawUtf8Bytes > REVIEW_RESULT_MAX_UTF8_BYTES || raw.includes("\u0000")) {
            throw new Error("Pullfrog result is empty or exceeds the artifact boundary");
          }
          let result;
          try {
            result = JSON.parse(raw);
          } catch {
            throw new Error("Pullfrog result must be valid JSON before artifact handoff");
          }
          if (typeof result?.review_body === "string" && result.review_body.includes("\u0000")) {
            throw new Error("Pullfrog result review body must not contain NUL");
          }

          const resultRoot = path.join(process.env.RUNNER_TEMP, "pullfrog-review-result");
          fs.mkdirSync(resultRoot, { recursive: false, mode: 0o700 });
          fs.writeFileSync(path.join(resultRoot, "review.json"), raw, {
            encoding: "utf8",
            mode: 0o600,
            flag: "wx",
          });
      - name: Upload structured review result
        uses: actions/upload-artifact@v4
        with:
          name: pullfrog-review-${{ needs.context.outputs.pull_number }}-${{ needs.context.outputs.head_sha }}
          path: ${{ runner.temp }}/pullfrog-review-result/review.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Update final review comment
    needs: [context, review]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    concurrency:
      group: pullfrog-final-review-${{ needs.context.outputs.pull_number }}
      cancel-in-progress: false
    steps:
      - name: Download structured review result
        uses: actions/download-artifact@v4
        with:
          name: pullfrog-review-${{ needs.context.outputs.pull_number }}-${{ needs.context.outputs.head_sha }}
          path: ${{ runner.temp }}/pullfrog-review-result-download
      - name: Upsert workflow-owned final review
        uses: actions/github-script@v9
        env:
          PULL_NUMBER: ${{ needs.context.outputs.pull_number }}
          EXPECTED_BASE_SHA: ${{ needs.context.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          REVIEW_RESULT_ROOT: ${{ runner.temp }}/pullfrog-review-result-download
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            // Keep in sync with the stage job and the schema comment above.
            const REVIEW_RESULT_MAX_UTF8_BYTES = 720_256;
            const REVIEW_BODY_MAX_CODE_POINTS = 60_000;
            const marker = "<!-- niceeval-pullfrog-final-review-v2 -->";
            const pullNumber = Number(process.env.PULL_NUMBER);
            const expectedBaseSha = process.env.EXPECTED_BASE_SHA;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              throw new Error("Trusted pull request number is invalid");
            }
            for (const [name, value] of [["base SHA", expectedBaseSha], ["head SHA", expectedHeadSha]]) {
              if (typeof value !== "string" || !/^[0-9a-f]{40}$/.test(value)) {
                throw new Error(`Trusted pull request ${name} is invalid`);
              }
            }

            const resultRoot = fs.realpathSync(process.env.REVIEW_RESULT_ROOT);
            const entries = fs.readdirSync(resultRoot).sort();
            if (entries.length !== 1 || entries[0] !== "review.json") {
              throw new Error("Pullfrog result artifact must contain exactly review.json");
            }
            const resultPath = path.join(resultRoot, "review.json");
            const resultStat = fs.lstatSync(resultPath);
            if (!resultStat.isFile() || resultStat.isSymbolicLink()) {
              throw new Error("Pullfrog result artifact entry must be a regular file");
            }
            if (resultStat.size < 1 || resultStat.size > REVIEW_RESULT_MAX_UTF8_BYTES) {
              throw new Error("Pullfrog result artifact is empty or too large");
            }
            if (fs.realpathSync(resultPath) !== resultPath) {
              throw new Error("Pullfrog result artifact escaped its download root");
            }

            let result;
            try {
              const raw = fs.readFileSync(resultPath, "utf8");
              if (raw.includes("\u0000")) throw new Error("NUL");
              result = JSON.parse(raw);
            } catch {
              throw new Error("Pullfrog result must be valid JSON");
            }
            if (result?.pull_number !== pullNumber) {
              throw new Error("Pullfrog result targets a different pull request");
            }
            if (result?.head_sha !== expectedHeadSha) {
              throw new Error("Pullfrog result does not match the locked pull request head");
            }
            if (typeof result?.review_body !== "string") {
              throw new Error("Pullfrog result has no review body");
            }
            if (result.review_body.includes("\u0000")) {
              throw new Error("Pullfrog result review body must not contain NUL");
            }

            const reviewBody = result.review_body.replace(/\r\n/g, "\n").trim();
            let reviewBodyCodePoints = 0;
            for (const _ of reviewBody) reviewBodyCodePoints += 1;
            if (reviewBodyCodePoints < 1 || reviewBodyCodePoints > REVIEW_BODY_MAX_CODE_POINTS) {
              throw new Error("Pullfrog review body is empty or too long");
            }
            if (reviewBody.includes(marker)) {
              throw new Error("Pullfrog review body must not contain the workflow marker");
            }
            const body = `${marker}\n${reviewBody}`;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const readCurrentPull = () => github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const isCurrent = (pull) =>
              pull.state === "open" &&
              pull.base.sha === expectedBaseSha &&
              pull.head.sha === expectedHeadSha;

            const firstRead = (await readCurrentPull()).data;
            if (!isCurrent(firstRead)) {
              core.notice("Skipping stale Pullfrog result because the locked PR base, head, or state changed");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const canonical = comments.filter((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              String(comment.body ?? "").split(/\r?\n/, 1)[0] === marker
            );
            if (canonical.length > 1) {
              throw new Error("Multiple workflow-owned Pullfrog review comments exist");
            }

            const finalRead = (await readCurrentPull()).data;
            if (!isCurrent(finalRead)) {
              core.notice("Skipping stale Pullfrog result because the locked PR base, head, or state changed");
              return;
            }

            if (canonical.length === 0) {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
              core.info(`Created canonical Pullfrog review comment ${created.data.id}`);
              return;
            }

            const updated = await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: canonical[0].id,
              body,
            });
            core.info(`Updated canonical Pullfrog review comment ${updated.data.id}`);
