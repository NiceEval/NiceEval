name: e2e

# E2E CI 编排（docs/engineering/testing/architecture/e2e/execution.md）。
# 只做 checkout / runtime / matrix / artifact；不解释产品 expected，不复制 manifest 选择。
#
# prepare → plan matrix、Testkit typecheck、pack 一次 NiceEval tgz + sha256
# e2e     → 并行 cell 下载并重算 candidate digest；所有独立 Repo 按 manifest batch 共机并发；
#           pnpm e2e run --candidate <exact> --plan <exact-plan> --cell <matrix-id>
#           （runner 在当前 checkout 为声明的 consumer clean-build Testkit 并注入目录依赖）
#           --artifact-root "$RUNNER_TEMP/niceeval-e2e-artifacts/<safe-id>"
#
# Lane: 同仓可信 PR / push main=main | fork / Dependabot PR=pr(无 secret)
#       schedule=nightly | dispatch=输入。所有 PR 使用 Nx affected；main push、
#       schedule、release 与显式 full 跑 lane 全集。fork / Dependabot PR 无 secret。
# 可信自动触发与显式启用 live provider 的 dispatch 按 manifest 白名单读取 secret；
# 同仓 PR 使用仓库级 secret，其它可信 lane 挂同名 GitHub Environment。

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "显式 lane"
        required: true
        type: choice
        options:
          - pr
          - main
          - nightly
          - release
        default: main
      repo:
        description: "只跑一个 Repo id（留空=该 lane 全集）"
        required: false
        type: string
      live_providers:
        description: "包含会调用真实公网 provider 的 Repo"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: prepare e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-jobs: ${{ steps.plan.outputs.has-jobs }}
      plan-mode: ${{ steps.plan.outputs.mode }}
      plan-reason: ${{ steps.plan.outputs.reason }}
      lane: ${{ steps.lane.outputs.lane }}
      inject-secrets: ${{ steps.lane.outputs.inject-secrets }}
      environment: ${{ steps.lane.outputs.environment }}
      candidate_sha256: ${{ steps.pack.outputs.candidate_sha256 }}
      toolchain_sha256: ${{ steps.toolchain.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm/setup 在 version 缺省时读取根 packageManager；不要在 workflow 重复版本真源。
      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        # `pnpm e2e pack` below invokes `pnpm pack`, whose prepare lifecycle
        # builds dist/ and INDEX.md. Do not perform the same build during install.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Concord CLI
        id: concord
        uses: ./.github/actions/setup-concord

      - name: Resolve lane and environment
        id: lane
        env:
          DISPATCH_LANE: ${{ github.event.inputs.lane }}
          DISPATCH_LIVE_PROVIDERS: ${{ github.event.inputs.live_providers }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
                && [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
                lane=main
                inject=true
                environment=
              else
                lane=pr
                inject=false
                environment=
              fi
              ;;
            schedule)
              lane=nightly
              inject=true
              environment=nightly
              ;;
            workflow_dispatch)
              lane="${DISPATCH_LANE:-main}"
              inject=false
              environment=
              ;;
            push)
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                lane=main
                inject=true
                environment=main
              else
                lane=pr
                inject=false
                environment=
              fi
              ;;
            *)
              lane=pr
              inject=false
              environment=
              ;;
          esac
          include_live="$inject"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$lane" in
              pr)
                inject=false
                environment=
                ;;
              main|nightly|release)
                inject=true
                environment="$lane"
                ;;
              *)
                echo "::error::unknown lane ${lane}"
                exit 1
                ;;
            esac
            if [ "${DISPATCH_LIVE_PROVIDERS:-false}" = "true" ]; then
              if [ "$lane" = "pr" ]; then
                echo "::error::live_providers=true is unavailable in the secret-free pr lane"
                exit 1
              fi
              include_live=true
              inject=true
              environment="$lane"
            else
              inject=false
              environment=
            fi
          fi
          {
            echo "lane=${lane}"
            echo "include-live=${include_live}"
            echo "inject-secrets=${inject}"
            echo "environment=${environment}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] lane=${lane} include-live=${include_live} inject-secrets=${inject} environment=${environment:-"(none)"}"

      - name: Run e2e plan --json
        id: plan
        env:
          LANE: ${{ steps.lane.outputs.lane }}
          DISPATCH_REPO: ${{ github.event.inputs.repo }}
          INCLUDE_LIVE_PROVIDERS: ${{ steps.lane.outputs.include-live }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(--lane "$LANE" --json --batch)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            checkout_head="$(git rev-parse HEAD)"
            args+=(--base "$BASE_SHA" --head "$checkout_head")
          else
            args+=(--no-diff)
          fi
          include_live=false
          if [ "$INCLUDE_LIVE_PROVIDERS" = "true" ]; then
            include_live=true
          else
            args+=(--exclude-external-network)
          fi
          repo="$(printf '%s' "${DISPATCH_REPO:-}" | tr -d '[:space:]')"
          if [ -n "$repo" ]; then
            args+=(--repo "$repo")
          fi
          plan_file="${RUNNER_TEMP}/e2e-plan.json"
          set +e
          pnpm --silent e2e plan "${args[@]}" > "$plan_file"
          plan_status=$?
          set -e
          if jq -e '(.mode | type == "string") and (.reason | type == "string")' "$plan_file" >/dev/null 2>&1; then
            {
              echo "### E2E plan"
              echo
              echo "- mode: \`$(jq -r '.mode' "$plan_file")\`"
              echo "- reason: \`$(jq -r '.reason' "$plan_file")\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$plan_status" -ne 0 ]; then
            echo "::error::E2E planning failed"
            cat "$plan_file" || true
            exit "$plan_status"
          fi
          if ! jq -e '(.mode == "affected" or .mode == "full" or .mode == "fail-open-full") and (.reason | type == "string") and (.cells | type == "array")' "$plan_file" >/dev/null; then
            echo "::error::plan --json did not emit a valid plan document"
            cat "$plan_file" || true
            exit 1
          fi
          count="$(jq '.cells | length' "$plan_file")"
          playwright_version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          if ! [[ "$playwright_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test must use an exact version for the CI browser image, got ${playwright_version}"
            exit 1
          fi
          playwright_image="mcr.microsoft.com/playwright:v${playwright_version}-noble"
          matrix="$(jq -c --arg playwright_image "$playwright_image" '
            .cells | map(. + {
              container: (
                if ((.requires.browsers // []) | length) > 0
                then $playwright_image
                else null
                end
              )
            })
          ' "$plan_file")"
          {
            echo "matrix=${matrix}"
            echo "mode=$(jq -r '.mode' "$plan_file")"
            echo "reason=$(jq -r '.reason' "$plan_file")"
            if [ "$count" -gt 0 ]; then
              echo "has-jobs=true"
            else
              echo "has-jobs=false"
            fi
          } >> "$GITHUB_OUTPUT"
          repo_count="$(jq '[.cells[].repoIds[]] | length' "$plan_file")"
          unique_repo_count="$(jq '[.cells[].repoIds[]] | unique | length' "$plan_file")"
          if [ "$repo_count" -ne "$unique_repo_count" ]; then
            echo "::error::batched plan contains duplicate Repo ids"
            exit 1
          fi
          browser_cells="$(jq '[.cells[] | select(((.requires.browsers // []) | length) > 0)] | length' "$plan_file")"
          echo "[e2e] plan mode=$(jq -r '.mode' "$plan_file") reason=$(jq -r '.reason' "$plan_file") lane=${LANE} live_providers=${include_live} selected ${repo_count} Repo(s) in ${count} cell(s) (${browser_cells} Playwright container): $(jq -r '[.cells[].repoIds[]] | join(", ")' "$plan_file")"
          {
            echo "- projects: ${repo_count}"
            echo "- cells: ${count}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable E2E plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niceeval-e2e-plan
          path: ${{ runner.temp }}/e2e-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck E2E runner
        if: steps.plan.outputs.has-jobs == 'true'
        run: pnpm --filter @niceeval/e2e-runner run typecheck

      - name: Capture verified E2E tools once
        if: steps.plan.outputs.has-jobs == 'true'
        id: toolchain
        env:
          CONCORD_PACKAGE_ROOT: ${{ steps.concord.outputs.package-root }}
        run: bash .github/scripts/e2e-toolchain.sh capture "${RUNNER_TEMP}/e2e-toolchain.tgz"

      - name: Upload verified E2E tools
        if: steps.plan.outputs.has-jobs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-toolchain
          path: ${{ runner.temp }}/e2e-toolchain.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Pack exact NiceEval candidate once
        if: steps.plan.outputs.has-jobs == 'true'
        id: pack
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/niceeval-e2e-candidate"
          mkdir -p "$out_dir"
          candidate_path="${out_dir}/niceeval-candidate.tgz"
          pnpm e2e pack --out "$candidate_path" | tee "${out_dir}/candidate-pack.json"
          test -f "$candidate_path"
          candidate_sha256="$(jq -r '.sha256' "${out_dir}/candidate-pack.json")"
          if [ -z "$candidate_sha256" ] || [ "$candidate_sha256" = "null" ]; then
            echo "::error::NiceEval pack did not emit sha256"
            exit 1
          fi
          candidate_actual="$(sha256sum "$candidate_path" | awk '{print $1}')"
          if [ "$candidate_actual" != "$candidate_sha256" ]; then
            echo "::error::NiceEval sha256 mismatch: pack=${candidate_sha256} recomputed=${candidate_actual}"
            exit 1
          fi
          printf '%s\n' "$candidate_sha256" > "${candidate_path}.sha256"
          cp "${RUNNER_TEMP}/e2e-plan.json" "${out_dir}/e2e-plan.json"
          {
            echo "candidate_sha256=${candidate_sha256}"
            echo "candidate_path=${candidate_path}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] NiceEval niceeval-candidate.tgz sha256=${candidate_sha256}"

      - name: Typecheck Testkit
        if: steps.plan.outputs.has-jobs == 'true'
        run: pnpm --filter @niceeval/testkit run typecheck

      - name: Upload exact NiceEval candidate
        if: steps.plan.outputs.has-jobs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: niceeval-e2e-candidate
          path: |
            ${{ steps.pack.outputs.candidate_path }}
            ${{ steps.pack.outputs.candidate_path }}.sha256
            ${{ runner.temp }}/niceeval-e2e-candidate/e2e-plan.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.id }})
    needs: prepare
    if: needs.prepare.outputs.has-jobs == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        # GitHub defaults container jobs to /bin/sh; every script in this job
        # relies on `set -o pipefail`, so host and container cells share Bash.
        shell: bash
    # 只有声明 browser capability 的 cell 进入精确 Playwright 版本镜像；其它 host / docker
    # cell 的 matrix.container 为 null，仍直接运行在普通 GitHub runner。镜像已经包含 browser
    # 与系统依赖，不在每次 job 中运行 apt / `playwright install --with-deps`。
    container: ${{ matrix.container }}
    # Each Repo owns its test budget through project.json E2E metadata. A cell may
    # host several Repos concurrently, so a second job-wide budget would race
    # their independent setup, test, collection, and cleanup lifecycles.
    # 同仓 PR 直接使用仓库级 secret；push、schedule 与显式 live dispatch 挂
    # 同名 Environment。所有路径都只注入 manifest 白名单中的 secret。
    environment: ${{ needs.prepare.outputs.inject-secrets == 'true' && needs.prepare.outputs.environment || fromJSON('null') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified E2E tools
        uses: actions/download-artifact@v8
        with:
          name: e2e-toolchain
          path: ${{ runner.temp }}/e2e-toolchain-download

      - name: Verify tools and repository environment
        id: toolchain
        env:
          EXPECTED_TOOLCHAIN_SHA256: ${{ needs.prepare.outputs.toolchain_sha256 }}
        run: bash .github/scripts/e2e-toolchain.sh restore "${RUNNER_TEMP}/e2e-toolchain-download/e2e-toolchain.tgz"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: e2e-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/**/pnpm-lock.yaml') }}
          restore-keys: |
            e2e-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}-

      - name: Install orchestrator dependencies
        # prepare 已从同一 checkout 构建并封装 exact candidate；matrix 只需要根 CLI 的
        # JS 依赖，不能为每个 cell 重跑根 prepare 的 report/index 构建。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Derive safe artifact id
        id: safe
        env:
          REPO_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$REPO_ID" | sed 's/[^A-Za-z0-9._-]/-/g')"
          echo "id=${safe}" >> "$GITHUB_OUTPUT"
          echo "artifact-root=${RUNNER_TEMP}/niceeval-e2e-artifacts/${safe}" >> "$GITHUB_OUTPUT"

      - name: Resolve cell manifests
        id: cell
        env:
          CELL_ID: ${{ matrix.id }}
          REPO_IDS_JSON: ${{ toJSON(matrix.repoIds) }}
          REPO_DIRS_JSON: ${{ toJSON(matrix.dirs) }}
        run: |
          set -euo pipefail
          manifests_file="${RUNNER_TEMP}/e2e-cell-manifests.json"
          node - "$manifests_file" <<'NODE'
          const fs = require("node:fs")

          const outputPath = process.argv[2]
          const ids = JSON.parse(process.env.REPO_IDS_JSON)
          const dirs = JSON.parse(process.env.REPO_DIRS_JSON)
          if (
            !Array.isArray(ids) ||
            !Array.isArray(dirs) ||
            ids.length === 0 ||
            ids.length !== dirs.length ||
            !ids.every((id) => typeof id === "string") ||
            !dirs.every((dir) => typeof dir === "string")
          ) {
            throw new Error("invalid cell repo mapping")
          }
          const manifests = ids.map((id, index) => ({
            id,
            manifest: `e2e/${dirs[index]}/project.json`,
          }))
          fs.writeFileSync(outputPath, `${JSON.stringify(manifests)}\n`)
          console.log(`[e2e] cell ${process.env.CELL_ID}: ${ids.join(", ")}`)
          NODE
          echo "manifests-file=${manifests_file}" >> "$GITHUB_OUTPUT"

      - name: Install Docker profile host prerequisites
        if: contains(toJSON(matrix.requires.hostCapabilities), '"linux-loop-project-quota"')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends quota
          # Hosted kernels may already include these modules without publishing
          # a matching linux-modules-extra package (for example Azure kernels).
          if ! sudo modprobe loop || ! sudo modprobe quota_v2; then
            sudo apt-get install --yes --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe loop
          sudo modprobe quota_v2
          sudo losetup --find >/dev/null

      - name: Set up Python
        if: contains(toJSON(matrix.requires.runtimes), '"python"') || contains(toJSON(matrix.requires.runtimes), '"python>=')
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact NiceEval candidate
        uses: actions/download-artifact@v8
        with:
          name: niceeval-e2e-candidate
          path: ${{ runner.temp }}/niceeval-e2e-candidate

      - name: Verify NiceEval SHA-256
        id: candidate
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/niceeval-e2e-candidate"
          candidate="${root}/niceeval-candidate.tgz"
          for required in "$candidate" "${candidate}.sha256"; do
            test -s "$required"
          done
          candidate_actual="$(sha256sum "$candidate" | awk '{print $1}')"
          if ! [[ "$EXPECTED_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::missing or invalid upstream candidate sha256 output: ${EXPECTED_CANDIDATE_SHA256:-<empty>}"
            exit 1
          fi
          if [ "$candidate_actual" != "$EXPECTED_CANDIDATE_SHA256" ] \
            || [ "$(tr -d '[:space:]' < "${candidate}.sha256")" != "$candidate_actual" ]; then
            echo "::error::NiceEval sha256 mismatch: expected=${EXPECTED_CANDIDATE_SHA256} actual=${candidate_actual}"
            exit 1
          fi
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"
          echo "[e2e] NiceEval ${candidate} sha256=${candidate_actual}"

      - name: Materialize candidate types for Testkit
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: |
          set -euo pipefail
          tar -xzf "$CANDIDATE" \
            -C packages/niceeval \
            --strip-components=1 \
            package/dist
          test -s packages/niceeval/dist/inspection/public.d.mts

      - name: Inject secrets for trusted lane
        if: needs.prepare.outputs.inject-secrets == 'true'
        env:
          MANIFESTS_FILE: ${{ steps.cell.outputs.manifests-file }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE_EOF'
          const fs = require("fs");
          const allowed = new Set([
            "ANTHROPIC_API_KEY",
            "ANTHROPIC_BASE_URL",
            "DEEPSEEK_API_KEY",
            "OPENCODE_API_KEY",
            "OPENAI_API_KEY",
            "OPENAI_BASE_URL",
          ]);
          const cells = JSON.parse(fs.readFileSync(process.env.MANIFESTS_FILE, "utf8"));
          const declared = [...new Set(cells.flatMap(({ manifest }) =>
            JSON.parse(fs.readFileSync(manifest, "utf8")).targets.e2e.metadata.niceeval.secrets
          ))];
          const lines = [];
          let injected = 0;
          for (const name of declared) {
            if (!allowed.has(name)) {
              throw new Error(`cell secret ${name} is not in the workflow allowlist`);
            }
            const value = process.env[name];
            if (typeof value !== "string" || value.length === 0) continue;
            const marker = `E2E_SECRET_${name}_${Math.random().toString(36).slice(2)}`;
            lines.push(`${name}<<${marker}`, value, marker);
            injected += 1;
          }
          if (lines.length > 0) {
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          }
          console.log(`[e2e] injected ${injected}/${declared.length} declared secret(s)`);
          NODE_EOF

      - name: Prepare model network
        id: model-network
        if: needs.prepare.outputs.inject-secrets == 'true'
        env:
          MANIFESTS_FILE: ${{ steps.cell.outputs.manifests-file }}
          JOB_CONTAINER: ${{ toJSON(matrix.container) }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          node .github/scripts/model-privacy.mjs mask
          node <<'NODE'
          const fs = require('node:fs');
          const cells = JSON.parse(fs.readFileSync(process.env.MANIFESTS_FILE, 'utf8'));
          const names = cells.flatMap(({ manifest }) => JSON.parse(fs.readFileSync(manifest, 'utf8')).targets.e2e.metadata.niceeval.secrets);
          const required = names.some((name) => name === 'OPENAI_BASE_URL' || name === 'ANTHROPIC_BASE_URL');
          if (required && (!process.env.TS_AUTHKEY || process.env.JOB_CONTAINER !== 'null')) {
            console.error('Model network requires TS_AUTHKEY and a host executor.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `required=${required}\n`);
          NODE

      - name: Connect model network
        id: tailnet
        if: steps.model-network.outputs.required == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-dns=false
          log-mode: quiet

      - name: Disable subnet routes
        if: steps.model-network.outputs.required == 'true'
        run: |
          if ! sudo tailscale set --accept-routes=false > /dev/null 2>&1; then
            echo '::error::Could not disable model network subnet routes.'
            exit 1
          fi

      - name: Check model connectivity
        if: steps.model-network.outputs.required == 'true'
        run: node .github/scripts/model-connectivity.mjs

      - name: Run e2e for ${{ matrix.id }}
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          PLAN: ${{ runner.temp }}/niceeval-e2e-candidate/e2e-plan.json
          CELL_ID: ${{ matrix.id }}
          ARTIFACT_ROOT: ${{ steps.safe.outputs.artifact-root }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          pnpm e2e run \
            --candidate "$CANDIDATE" \
            --plan "$PLAN" \
            --cell "$CELL_ID" \
            --artifact-root "$ARTIFACT_ROOT"

      - name: Prepare sanitized cell artifacts
        id: redact
        if: always() && steps.safe.outcome == 'success' && steps.cell.outcome == 'success'
        env:
          ARTIFACT_SOURCE: ${{ steps.safe.outputs.artifact-root }}
          ARTIFACT_SAFE: ${{ steps.safe.outputs.artifact-root }}-safe
          TS_AUTHKEY: ${{ needs.prepare.outputs.inject-secrets == 'true' && secrets.TS_AUTHKEY || '' }}
        run: node .github/scripts/model-privacy.mjs artifacts

      - name: Upload cell artifacts
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ steps.safe.outputs.id }}
          path: ${{ steps.safe.outputs.artifact-root }}-safe
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

      - name: Disconnect model network
        if: always() && steps.tailnet.outcome == 'success'
        run: |
          if ! sudo tailscale logout > /dev/null 2>&1; then
            echo '::error::Model network logout failed.'
            exit 1
          fi
          echo 'Model network logged out.'

  gate:
    name: e2e gate
    needs: [prepare, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete selected matrix
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          HAS_JOBS: ${{ needs.prepare.outputs.has-jobs }}
          MATRIX_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "::error::prepare e2e ended as ${PREPARE_RESULT}"
            exit 1
          fi
          if [ "$HAS_JOBS" = "true" ] && [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::e2e matrix ended as ${MATRIX_RESULT}"
            exit 1
          fi
          if [ "$HAS_JOBS" != "true" ] && [ "$MATRIX_RESULT" != "skipped" ]; then
            echo "::error::empty e2e plan expected a skipped matrix, got ${MATRIX_RESULT}"
            exit 1
          fi
          echo "[e2e] gate passed: has-jobs=${HAS_JOBS} matrix=${MATRIX_RESULT}"
