name: e2e

# E2E CI 编排（docs/engineering/testing/e2e/execution.md）。
# 只做 checkout / runtime / matrix / artifact；不解释产品 expected，不复制 manifest 选择。
#
# package → Testkit meta-test/typecheck；分别 pack 一次 NiceEval/Testkit tgz + sha256，上传 exact 双 tgz
# plan    → pnpm e2e plan --lane <lane> --json
# e2e     → 下载并重算同一双 tgz digest；pnpm e2e run --candidate <exact> --testkit <exact> --repo <id>
#           --artifact-root "$RUNNER_TEMP/niceeval-e2e-artifacts/<safe-id>"
# aggregate → 汇总 cell receipt/summary
#
# Lane: PR=pr(无 secret) | push main=main | schedule=nightly | dispatch=输入
# 可信 lane 挂 GitHub Environment（与 lane 同名），不复制 Repo 选择逻辑。

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "显式 lane"
        required: true
        type: choice
        options:
          - pr
          - main
          - nightly
          - release
        default: pr
      repo:
        description: "只跑一个 Repo id（留空=该 lane 全集）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_sha256: ${{ steps.pack.outputs.candidate_sha256 }}
      candidate_tgz_name: ${{ steps.pack.outputs.candidate_tgz_name }}
      testkit_sha256: ${{ steps.pack.outputs.testkit_sha256 }}
      testkit_tgz_name: ${{ steps.pack.outputs.testkit_tgz_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/setup 在 version 缺省时读取根 packageManager；不要在 workflow 重复版本真源。
      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Testkit meta-tests
        run: pnpm --filter @niceeval/testkit run test

      - name: Typecheck Testkit
        run: pnpm --filter @niceeval/testkit run typecheck

      - name: Build and pack exact E2E tarballs once
        id: pack
        run: |
          set -euo pipefail
          shopt -s nullglob
          out_dir="${RUNNER_TEMP}/niceeval-e2e-tarballs"
          mkdir -p "$out_dir"
          candidate_tgz_name="niceeval-candidate.tgz"
          candidate_path="${out_dir}/${candidate_tgz_name}"
          pnpm e2e pack --out "$candidate_path" | tee "${out_dir}/candidate-pack.json"
          test -f "$candidate_path"
          candidate_sha256="$(jq -r '.sha256' "${out_dir}/candidate-pack.json")"
          if [ -z "$candidate_sha256" ] || [ "$candidate_sha256" = "null" ]; then
            echo "::error::NiceEval pack did not emit sha256"
            exit 1
          fi
          candidate_actual="$(sha256sum "$candidate_path" | awk '{print $1}')"
          if [ "$candidate_actual" != "$candidate_sha256" ]; then
            echo "::error::NiceEval sha256 mismatch: pack=${candidate_sha256} recomputed=${candidate_actual}"
            exit 1
          fi

          # Testkit 的 build 脚本先清空 dist/；pack 禁用 lifecycle script，确保不会在
          # 已验收的 clean build 后再次构建。唯一生成物随后改为内容寻址文件名。
          pnpm --filter @niceeval/testkit run build
          testkit_stage="${out_dir}/testkit-stage"
          mkdir -p "$testkit_stage"
          PNPM_CONFIG_IGNORE_SCRIPTS=true pnpm --filter @niceeval/testkit pack --pack-destination "$testkit_stage"
          testkit_tgzs=("${testkit_stage}"/*.tgz)
          if [ "${#testkit_tgzs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Testkit tgz, found ${#testkit_tgzs[@]}"
            exit 1
          fi
          testkit_actual="$(sha256sum "${testkit_tgzs[0]}" | awk '{print $1}')"
          testkit_tgz_name="niceeval-testkit-${testkit_actual}.tgz"
          testkit_path="${out_dir}/${testkit_tgz_name}"
          mv "${testkit_tgzs[0]}" "$testkit_path"
          testkit_sha256="$(sha256sum "$testkit_path" | awk '{print $1}')"
          if [ "$testkit_actual" != "$testkit_sha256" ]; then
            echo "::error::Testkit sha256 changed while naming tarball"
            exit 1
          fi

          printf '%s\n' "$candidate_sha256" > "${candidate_path}.sha256"
          printf '%s\n' "$testkit_sha256" > "${testkit_path}.sha256"
          {
            echo "candidate_sha256=${candidate_sha256}"
            echo "candidate_tgz_name=${candidate_tgz_name}"
            echo "candidate_path=${candidate_path}"
            echo "testkit_sha256=${testkit_sha256}"
            echo "testkit_tgz_name=${testkit_tgz_name}"
            echo "testkit_path=${testkit_path}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] NiceEval ${candidate_tgz_name} sha256=${candidate_sha256}"
          echo "[e2e] Testkit ${testkit_tgz_name} sha256=${testkit_sha256}"

      # Vitest 本身不以 Node 18 为运行时；记录一个真实 Node 18 二进制，再恢复
      # orchestration Node，使 docs guard 能在同一次测试中以 raw Node 18 运行 consumer。
      - name: Set up Node 18 Testkit consumer runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Record Node 18 executable
        id: node18
        run: |
          set -euo pipefail
          node18="$(command -v node)"
          "$node18" --version | grep -E '^v18\.'
          echo "path=${node18}" >> "$GITHUB_OUTPUT"

      - name: Restore Node for docs guards
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 只运行直接读取这两份 upload 前 tgz 的 guard。全量 test:docs 还包含独立的
      # 文档写作台账，不能让其无关失败阻断 artifact 身份 gate。
      - name: Guard exact E2E tarballs before upload
        env:
          NICEEVAL_CANDIDATE_TGZ: ${{ steps.pack.outputs.candidate_path }}
          NICEEVAL_TESTKIT_TGZ: ${{ steps.pack.outputs.testkit_path }}
          NICEEVAL_TESTKIT_NODE18: ${{ steps.node18.outputs.path }}
          NICEEVAL_EXACT_E2E_TARBALLS: "true"
        run: pnpm exec vitest run --project docs test/docs/e2e-testkit-ci-guards.test.ts

      - name: Upload exact E2E tarballs
        uses: actions/upload-artifact@v4
        with:
          name: niceeval-e2e-tarballs
          path: |
            ${{ steps.pack.outputs.candidate_path }}
            ${{ steps.pack.outputs.candidate_path }}.sha256
            ${{ steps.pack.outputs.testkit_path }}
            ${{ steps.pack.outputs.testkit_path }}.sha256
          if-no-files-found: error
          retention-days: 14

  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-jobs: ${{ steps.plan.outputs.has-jobs }}
      lane: ${{ steps.lane.outputs.lane }}
      inject-secrets: ${{ steps.lane.outputs.inject-secrets }}
      environment: ${{ steps.lane.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve lane and environment
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_LANE: ${{ github.event.inputs.lane }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) lane=pr ;;
            schedule) lane=nightly ;;
            workflow_dispatch) lane="${DISPATCH_LANE:-pr}" ;;
            push)
              if [ "$REF" = "refs/heads/main" ]; then lane=main; else lane=pr; fi
              ;;
            *) lane=pr ;;
          esac
          case "$lane" in
            pr)
              inject=false
              environment=
              ;;
            main|nightly|release)
              inject=true
              environment="$lane"
              ;;
            *)
              echo "::error::unknown lane ${lane}"
              exit 1
              ;;
          esac
          {
            echo "lane=${lane}"
            echo "inject-secrets=${inject}"
            echo "environment=${environment}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] lane=${lane} inject-secrets=${inject} environment=${environment:-"(none)"}"

      - name: Run e2e plan --json
        id: plan
        env:
          LANE: ${{ steps.lane.outputs.lane }}
          DISPATCH_REPO: ${{ github.event.inputs.repo }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--lane "$LANE" --json)
          repo="$(printf '%s' "${DISPATCH_REPO:-}" | tr -d '[:space:]')"
          if [ -n "$repo" ]; then
            args+=(--repo "$repo")
          fi
          # 能求 diff 时交给 plan 做 path 省时；否则 fail-open 跑 lane 全集
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              while IFS= read -r path; do
                [ -n "$path" ] && args+=(--diff-path "$path")
              done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            else
              echo "[e2e] base unavailable — full lane (fail-open)"
            fi
          fi
          plan_file="${RUNNER_TEMP}/e2e-plan.json"
          pnpm e2e plan "${args[@]}" > "$plan_file"
          if ! jq -e 'type == "array"' "$plan_file" >/dev/null; then
            echo "::error::plan --json did not emit a JSON array"
            cat "$plan_file" || true
            exit 1
          fi
          count="$(jq 'length' "$plan_file")"
          {
            echo "matrix=$(jq -c '.' "$plan_file")"
            if [ "$count" -gt 0 ]; then
              echo "has-jobs=true"
            else
              echo "has-jobs=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] plan lane=${LANE} selected ${count}: $(jq -r '[.[].id] | join(", ")' "$plan_file")"

  e2e:
    name: e2e (${{ matrix.id }})
    needs: [package, plan]
    if: needs.plan.outputs.has-jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # PR: null（不挂 Environment）；main/nightly/release: 同名 Environment
    environment: ${{ needs.plan.outputs.inject-secrets == 'true' && needs.plan.outputs.environment || fromJSON('null') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install orchestrator dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        if: contains(toJSON(matrix.requires), 'python')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Playwright browsers
        if: contains(toJSON(matrix.requires), 'chromium') || contains(toJSON(matrix.requires), 'firefox') || contains(toJSON(matrix.requires), 'webkit')
        run: pnpm exec playwright install --with-deps

      - name: Derive safe artifact id
        id: safe
        env:
          REPO_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$REPO_ID" | sed 's/[^A-Za-z0-9._-]/-/g')"
          echo "id=${safe}" >> "$GITHUB_OUTPUT"
          echo "artifact-root=${RUNNER_TEMP}/niceeval-e2e-artifacts/${safe}" >> "$GITHUB_OUTPUT"

      - name: Download exact E2E tarballs
        uses: actions/download-artifact@v4
        with:
          name: niceeval-e2e-tarballs
          path: ${{ runner.temp }}/niceeval-e2e-tarballs

      - name: Verify NiceEval and Testkit SHA-256
        id: tarballs
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.package.outputs.candidate_sha256 }}
          CANDIDATE_TGZ_NAME: ${{ needs.package.outputs.candidate_tgz_name }}
          EXPECTED_TESTKIT_SHA256: ${{ needs.package.outputs.testkit_sha256 }}
          TESTKIT_TGZ_NAME: ${{ needs.package.outputs.testkit_tgz_name }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/niceeval-e2e-tarballs"
          candidate="${root}/${CANDIDATE_TGZ_NAME}"
          testkit="${root}/${TESTKIT_TGZ_NAME}"
          for required in "$candidate" "$testkit" "${candidate}.sha256" "${testkit}.sha256"; do
            test -s "$required"
          done
          candidate_actual="$(sha256sum "$candidate" | awk '{print $1}')"
          testkit_actual="$(sha256sum "$testkit" | awk '{print $1}')"
          for expected in "$EXPECTED_CANDIDATE_SHA256" "$EXPECTED_TESTKIT_SHA256"; do
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::missing or invalid upstream sha256 output: ${expected:-<empty>}"
              exit 1
            fi
          done
          if [ "$candidate_actual" != "$EXPECTED_CANDIDATE_SHA256" ] \
            || [ "$(tr -d '[:space:]' < "${candidate}.sha256")" != "$candidate_actual" ]; then
            echo "::error::NiceEval sha256 mismatch: expected=${EXPECTED_CANDIDATE_SHA256} actual=${candidate_actual}"
            exit 1
          fi
          if [ "$testkit_actual" != "$EXPECTED_TESTKIT_SHA256" ] \
            || [ "$(tr -d '[:space:]' < "${testkit}.sha256")" != "$testkit_actual" ]; then
            echo "::error::Testkit sha256 mismatch: expected=${EXPECTED_TESTKIT_SHA256} actual=${testkit_actual}"
            exit 1
          fi
          {
            echo "candidate=${candidate}"
            echo "testkit=${testkit}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] NiceEval ${candidate} sha256=${candidate_actual}"
          echo "[e2e] Testkit ${testkit} sha256=${testkit_actual}"

      - name: Inject secrets for trusted lane
        if: needs.plan.outputs.inject-secrets == 'true'
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          MANIFEST: e2e/${{ matrix.dir }}/e2e.json
        run: |
          set -euo pipefail
          node <<'NODE_EOF'
          const fs = require("fs");
          const all = JSON.parse(process.env.ALL_SECRETS_JSON || "{}");
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
          const lines = [];
          let injected = 0;
          for (const name of manifest.secrets) {
            const value = all[name];
            if (typeof value !== "string" || value.length === 0) continue;
            const marker = `E2E_SECRET_${name}_${Math.random().toString(36).slice(2)}`;
            lines.push(`${name}<<${marker}`, value, marker);
            injected += 1;
          }
          if (lines.length > 0) {
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          }
          console.log(`[e2e] injected ${injected}/${manifest.secrets.length} declared secret(s)`);
          NODE_EOF

      - name: Run e2e for ${{ matrix.id }}
        env:
          CANDIDATE: ${{ steps.tarballs.outputs.candidate }}
          TESTKIT: ${{ steps.tarballs.outputs.testkit }}
          REPO_ID: ${{ matrix.id }}
          ARTIFACT_ROOT: ${{ steps.safe.outputs.artifact-root }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          pnpm e2e run \
            --candidate "$CANDIDATE" \
            --testkit "$TESTKIT" \
            --repo "$REPO_ID" \
            --artifact-root "$ARTIFACT_ROOT"

      - name: Redact secrets in artifactRoot
        if: always() && needs.plan.outputs.inject-secrets == 'true'
        env:
          ALL_SECRETS_JSON: ${{ needs.plan.outputs.inject-secrets == 'true' && toJSON(secrets) || '{}' }}
          ARTIFACT_ROOT: ${{ steps.safe.outputs.artifact-root }}
        run: |
          set -euo pipefail
          if [ ! -d "$ARTIFACT_ROOT" ]; then
            echo "[e2e] no artifactRoot to redact"
            exit 0
          fi
          node <<'NODE_EOF'
          const fs = require("fs");
          const path = require("path");
          const root = process.env.ARTIFACT_ROOT;
          const all = JSON.parse(process.env.ALL_SECRETS_JSON || "{}");
          const replacements = Object.entries(all)
            .filter(([, value]) => typeof value === "string" && value.length > 0)
            .map(([name, value]) => ({ name, value }));
          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const abs = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(abs, files);
              else if (entry.isFile()) files.push(abs);
            }
            return files;
          }
          const files = walk(root);
          let hits = 0;
          for (const abs of files) {
            let text;
            try {
              text = fs.readFileSync(abs, "utf8");
            } catch {
              continue;
            }
            let next = text;
            for (const { name, value } of replacements) {
              if (next.includes(value)) {
                hits += next.split(value).length - 1;
                next = next.split(value).join(`<redacted:${name}>`);
              }
            }
            if (next !== text) fs.writeFileSync(abs, next, "utf8");
          }
          console.log(`[e2e] redaction: ${hits} occurrence(s) across ${files.length} file(s)`);
          NODE_EOF

      - name: Upload cell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ steps.safe.outputs.id }}
          path: ${{ steps.safe.outputs.artifact-root }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  aggregate:
    name: aggregate e2e
    needs: [package, plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check upstream outcomes
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          HAS_JOBS: ${{ needs.plan.outputs.has-jobs }}
          LANE: ${{ needs.plan.outputs.lane }}
          CANDIDATE_SHA256: ${{ needs.package.outputs.candidate_sha256 }}
          TESTKIT_SHA256: ${{ needs.package.outputs.testkit_sha256 }}
        run: |
          set -euo pipefail
          echo "[e2e] lane=${LANE:-unknown}"
          echo "[e2e] candidate sha256=${CANDIDATE_SHA256:-unknown}"
          echo "[e2e] testkit sha256=${TESTKIT_SHA256:-unknown}"
          echo "[e2e] package=${PACKAGE_RESULT} plan=${PLAN_RESULT} e2e=${E2E_RESULT:-skipped} has-jobs=${HAS_JOBS:-}"
          if [ "$PACKAGE_RESULT" != "success" ]; then
            echo "::error::package job failed"
            exit 1
          fi
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan job failed"
            exit 1
          fi
          if [ "${HAS_JOBS}" != "true" ]; then
            echo "[e2e] no matrix cells — aggregate ok"
            exit 0
          fi

      - name: Download all cell artifacts
        if: needs.plan.outputs.has-jobs == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e-cells
          merge-multiple: false

      - name: Summarize cells
        if: needs.plan.outputs.has-jobs == 'true'
        env:
          CELLS_ROOT: ${{ runner.temp }}/e2e-cells
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [ ! -d "$CELLS_ROOT" ]; then
            echo "::error::no cell artifacts downloaded"
            exit 1
          fi
          echo "=== e2e aggregate ==="
          echo "candidate sha256: ${{ needs.package.outputs.candidate_sha256 }}"
          echo "testkit sha256: ${{ needs.package.outputs.testkit_sha256 }}"
          echo "lane: ${{ needs.plan.outputs.lane }}"
          echo
          cells=0
          receipts=0
          summaries=0
          junit_files=0
          while IFS= read -r -d '' dir; do
            cells=$((cells + 1))
            rel="${dir#"$CELLS_ROOT"/}"
            echo "--- cell: ${rel} ---"
            if [ -f "${dir}/summary.json" ]; then
              summaries=$((summaries + 1))
              jq -c '{passed, regression, infra, total, results: [.results[] | {id, exitCode, category, detail}]}' \
                "${dir}/summary.json" || cat "${dir}/summary.json"
            fi
            while IFS= read -r -d '' receipt; do
              receipts=$((receipts + 1))
              echo "receipt: ${receipt#"$dir"/}"
              jq -c '{repoId, exitCode, category, detail, stages: [.stages[]? | .stage + "=" + (if .ok then "ok" else "fail" end)]}' \
                "$receipt" 2>/dev/null || jq -c '.' "$receipt" 2>/dev/null || echo "(unreadable receipt)"
            done < <(find "$dir" -type f -name receipt.json -print0 | sort -z)
            while IFS= read -r -d '' junit; do
              junit_files=$((junit_files + 1))
              echo "junit: ${junit#"$dir"/}"
            done < <(find "$dir" -type f \( -iname 'junit*.xml' -o -path '*/junit/*.xml' \) -print0 | sort -z)
            echo
          done < <(find "$CELLS_ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          echo "cells=${cells} summaries=${summaries} receipts=${receipts} junit=${junit_files}"
          echo "matrix job result: ${E2E_RESULT}"
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::one or more e2e matrix cells failed (result=${E2E_RESULT})"
            exit 1
          fi
          if [ "$cells" -eq 0 ]; then
            echo "::error::expected cell artifacts but found none"
            exit 1
          fi
          if [ "$summaries" -ne "$cells" ] || [ "$receipts" -lt "$cells" ]; then
            echo "::error::incomplete execution evidence: cells=${cells} summaries=${summaries} receipts=${receipts}"
            exit 1
          fi
