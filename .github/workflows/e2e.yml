name: e2e

# E2E CI 编排（docs/engineering/testing/e2e/execution.md）。
# 只做 checkout / runtime / matrix / artifact；不解释产品 expected，不复制 manifest 选择。
#
# package → pack 一次 candidate.tgz + sha256，上传 exact tgz
# plan    → pnpm e2e plan --lane <lane> --json
# e2e     → 下载同一 tgz；pnpm e2e run --candidate <exact> --repo <id>
#           --artifact-root "$RUNNER_TEMP/niceeval-e2e-artifacts/<safe-id>"
# aggregate → 汇总 cell receipt/summary
#
# Lane: PR=pr(无 secret) | push main=main | schedule=nightly | dispatch=输入
# 可信 lane 挂 GitHub Environment（与 lane 同名），不复制 Repo 选择逻辑。

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "显式 lane"
        required: true
        type: choice
        options:
          - pr
          - main
          - nightly
          - release
        default: pr
      repo:
        description: "只跑一个 Repo id（留空=该 lane 全集）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      tgz-name: ${{ steps.pack.outputs.tgz-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack candidate once
        id: pack
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/niceeval-pack"
          mkdir -p "$out_dir"
          tgz_name="niceeval-candidate.tgz"
          out="${out_dir}/${tgz_name}"
          pnpm e2e pack --out "$out" | tee "${out_dir}/pack.json"
          test -f "$out"
          sha256="$(jq -r '.sha256' "${out_dir}/pack.json")"
          if [ -z "$sha256" ] || [ "$sha256" = "null" ]; then
            echo "::error::pack did not emit sha256"
            exit 1
          fi
          recomputed="$(sha256sum "$out" | awk '{print $1}')"
          if [ "$recomputed" != "$sha256" ]; then
            echo "::error::sha256 mismatch: pack=${sha256} recomputed=${recomputed}"
            exit 1
          fi
          echo "$sha256" > "${out_dir}/niceeval-candidate.sha256"
          {
            echo "sha256=${sha256}"
            echo "tgz-name=${tgz_name}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] packed ${tgz_name} sha256=${sha256}"

      - name: Upload exact candidate tgz
        uses: actions/upload-artifact@v4
        with:
          name: niceeval-candidate
          path: |
            ${{ runner.temp }}/niceeval-pack/niceeval-candidate.tgz
            ${{ runner.temp }}/niceeval-pack/niceeval-candidate.sha256
          if-no-files-found: error
          retention-days: 14

  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-jobs: ${{ steps.plan.outputs.has-jobs }}
      lane: ${{ steps.lane.outputs.lane }}
      inject-secrets: ${{ steps.lane.outputs.inject-secrets }}
      environment: ${{ steps.lane.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve lane and environment
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_LANE: ${{ github.event.inputs.lane }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) lane=pr ;;
            schedule) lane=nightly ;;
            workflow_dispatch) lane="${DISPATCH_LANE:-pr}" ;;
            push)
              if [ "$REF" = "refs/heads/main" ]; then lane=main; else lane=pr; fi
              ;;
            *) lane=pr ;;
          esac
          case "$lane" in
            pr)
              inject=false
              environment=
              ;;
            main|nightly|release)
              inject=true
              environment="$lane"
              ;;
            *)
              echo "::error::unknown lane ${lane}"
              exit 1
              ;;
          esac
          {
            echo "lane=${lane}"
            echo "inject-secrets=${inject}"
            echo "environment=${environment}"
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] lane=${lane} inject-secrets=${inject} environment=${environment:-"(none)"}"

      - name: Run e2e plan --json
        id: plan
        env:
          LANE: ${{ steps.lane.outputs.lane }}
          DISPATCH_REPO: ${{ github.event.inputs.repo }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--lane "$LANE" --json)
          repo="$(printf '%s' "${DISPATCH_REPO:-}" | tr -d '[:space:]')"
          if [ -n "$repo" ]; then
            args+=(--repo "$repo")
          fi
          # 能求 diff 时交给 plan 做 path 省时；否则 fail-open 跑 lane 全集
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              while IFS= read -r path; do
                [ -n "$path" ] && args+=(--diff-path "$path")
              done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            else
              echo "[e2e] base unavailable — full lane (fail-open)"
            fi
          fi
          plan_file="${RUNNER_TEMP}/e2e-plan.json"
          pnpm e2e plan "${args[@]}" > "$plan_file"
          if ! jq -e 'type == "array"' "$plan_file" >/dev/null; then
            echo "::error::plan --json did not emit a JSON array"
            cat "$plan_file" || true
            exit 1
          fi
          count="$(jq 'length' "$plan_file")"
          {
            echo "matrix=$(jq -c '.' "$plan_file")"
            if [ "$count" -gt 0 ]; then
              echo "has-jobs=true"
            else
              echo "has-jobs=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "[e2e] plan lane=${LANE} selected ${count}: $(jq -r '[.[].id] | join(", ")' "$plan_file")"

  e2e:
    name: e2e (${{ matrix.id }})
    needs: [package, plan]
    if: needs.plan.outputs.has-jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # PR: null（不挂 Environment）；main/nightly/release: 同名 Environment
    environment: ${{ needs.plan.outputs.inject-secrets == 'true' && needs.plan.outputs.environment || fromJSON('null') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install orchestrator dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        if: contains(toJSON(matrix.requires), 'python')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Playwright browsers
        if: contains(toJSON(matrix.requires), 'chromium') || contains(toJSON(matrix.requires), 'firefox') || contains(toJSON(matrix.requires), 'webkit')
        run: pnpm exec playwright install --with-deps

      - name: Derive safe artifact id
        id: safe
        env:
          REPO_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$REPO_ID" | sed 's/[^A-Za-z0-9._-]/-/g')"
          echo "id=${safe}" >> "$GITHUB_OUTPUT"
          echo "artifact-root=${RUNNER_TEMP}/niceeval-e2e-artifacts/${safe}" >> "$GITHUB_OUTPUT"

      - name: Download candidate tgz
        uses: actions/download-artifact@v4
        with:
          name: niceeval-candidate
          path: ${{ runner.temp }}/niceeval-candidate

      - name: Verify candidate sha256
        id: candidate
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          TGZ_NAME: ${{ needs.package.outputs.tgz-name }}
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/niceeval-candidate/${TGZ_NAME}"
          test -f "$candidate"
          actual="$(sha256sum "$candidate" | awk '{print $1}')"
          if [ -n "$EXPECTED_SHA256" ] && [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::candidate sha256 mismatch: expected=${EXPECTED_SHA256} actual=${actual}"
            exit 1
          fi
          echo "path=${candidate}" >> "$GITHUB_OUTPUT"
          echo "[e2e] candidate ${candidate} sha256=${actual}"

      - name: Inject secrets for trusted lane
        if: needs.plan.outputs.inject-secrets == 'true'
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          MANIFEST: e2e/${{ matrix.dir }}/e2e.json
        run: |
          set -euo pipefail
          node <<'NODE_EOF'
          const fs = require("fs");
          const all = JSON.parse(process.env.ALL_SECRETS_JSON || "{}");
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
          const lines = [];
          let injected = 0;
          for (const name of manifest.secrets) {
            const value = all[name];
            if (typeof value !== "string" || value.length === 0) continue;
            const marker = `E2E_SECRET_${name}_${Math.random().toString(36).slice(2)}`;
            lines.push(`${name}<<${marker}`, value, marker);
            injected += 1;
          }
          if (lines.length > 0) {
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          }
          console.log(`[e2e] injected ${injected}/${manifest.secrets.length} declared secret(s)`);
          NODE_EOF

      - name: Run e2e for ${{ matrix.id }}
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          REPO_ID: ${{ matrix.id }}
          ARTIFACT_ROOT: ${{ steps.safe.outputs.artifact-root }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          pnpm e2e run \
            --candidate "$CANDIDATE" \
            --repo "$REPO_ID" \
            --artifact-root "$ARTIFACT_ROOT"

      - name: Redact secrets in artifactRoot
        if: always() && needs.plan.outputs.inject-secrets == 'true'
        env:
          ALL_SECRETS_JSON: ${{ needs.plan.outputs.inject-secrets == 'true' && toJSON(secrets) || '{}' }}
          ARTIFACT_ROOT: ${{ steps.safe.outputs.artifact-root }}
        run: |
          set -euo pipefail
          if [ ! -d "$ARTIFACT_ROOT" ]; then
            echo "[e2e] no artifactRoot to redact"
            exit 0
          fi
          node <<'NODE_EOF'
          const fs = require("fs");
          const path = require("path");
          const root = process.env.ARTIFACT_ROOT;
          const all = JSON.parse(process.env.ALL_SECRETS_JSON || "{}");
          const replacements = Object.entries(all)
            .filter(([, value]) => typeof value === "string" && value.length > 0)
            .map(([name, value]) => ({ name, value }));
          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const abs = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(abs, files);
              else if (entry.isFile()) files.push(abs);
            }
            return files;
          }
          const files = walk(root);
          let hits = 0;
          for (const abs of files) {
            let text;
            try {
              text = fs.readFileSync(abs, "utf8");
            } catch {
              continue;
            }
            let next = text;
            for (const { name, value } of replacements) {
              if (next.includes(value)) {
                hits += next.split(value).length - 1;
                next = next.split(value).join(`<redacted:${name}>`);
              }
            }
            if (next !== text) fs.writeFileSync(abs, next, "utf8");
          }
          console.log(`[e2e] redaction: ${hits} occurrence(s) across ${files.length} file(s)`);
          NODE_EOF

      - name: Upload cell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ steps.safe.outputs.id }}
          path: ${{ steps.safe.outputs.artifact-root }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  aggregate:
    name: aggregate e2e
    needs: [package, plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check upstream outcomes
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          HAS_JOBS: ${{ needs.plan.outputs.has-jobs }}
          LANE: ${{ needs.plan.outputs.lane }}
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "[e2e] lane=${LANE:-unknown}"
          echo "[e2e] candidate sha256=${SHA256:-unknown}"
          echo "[e2e] package=${PACKAGE_RESULT} plan=${PLAN_RESULT} e2e=${E2E_RESULT:-skipped} has-jobs=${HAS_JOBS:-}"
          if [ "$PACKAGE_RESULT" != "success" ]; then
            echo "::error::package job failed"
            exit 1
          fi
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan job failed"
            exit 1
          fi
          if [ "${HAS_JOBS}" != "true" ]; then
            echo "[e2e] no matrix cells — aggregate ok"
            exit 0
          fi

      - name: Download all cell artifacts
        if: needs.plan.outputs.has-jobs == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e-cells
          merge-multiple: false

      - name: Summarize cells
        if: needs.plan.outputs.has-jobs == 'true'
        env:
          CELLS_ROOT: ${{ runner.temp }}/e2e-cells
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [ ! -d "$CELLS_ROOT" ]; then
            echo "::error::no cell artifacts downloaded"
            exit 1
          fi
          echo "=== e2e aggregate ==="
          echo "candidate sha256: ${{ needs.package.outputs.sha256 }}"
          echo "lane: ${{ needs.plan.outputs.lane }}"
          echo
          cells=0
          receipts=0
          summaries=0
          junit_files=0
          while IFS= read -r -d '' dir; do
            cells=$((cells + 1))
            rel="${dir#"$CELLS_ROOT"/}"
            echo "--- cell: ${rel} ---"
            if [ -f "${dir}/summary.json" ]; then
              summaries=$((summaries + 1))
              jq -c '{passed, regression, infra, total, results: [.results[] | {id, exitCode, category, detail}]}' \
                "${dir}/summary.json" || cat "${dir}/summary.json"
            fi
            while IFS= read -r -d '' receipt; do
              receipts=$((receipts + 1))
              echo "receipt: ${receipt#"$dir"/}"
              jq -c '{repoId, exitCode, category, detail, stages: [.stages[]? | .stage + "=" + (if .ok then "ok" else "fail" end)]}' \
                "$receipt" 2>/dev/null || jq -c '.' "$receipt" 2>/dev/null || echo "(unreadable receipt)"
            done < <(find "$dir" -type f -name receipt.json -print0 | sort -z)
            while IFS= read -r -d '' junit; do
              junit_files=$((junit_files + 1))
              echo "junit: ${junit#"$dir"/}"
            done < <(find "$dir" -type f \( -iname 'junit*.xml' -o -path '*/junit/*.xml' \) -print0 | sort -z)
            echo
          done < <(find "$CELLS_ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          echo "cells=${cells} summaries=${summaries} receipts=${receipts} junit=${junit_files}"
          echo "matrix job result: ${E2E_RESULT}"
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::one or more e2e matrix cells failed (result=${E2E_RESULT})"
            exit 1
          fi
          if [ "$cells" -eq 0 ]; then
            echo "::error::expected cell artifacts but found none"
            exit 1
          fi
          if [ "$summaries" -ne "$cells" ] || [ "$receipts" -lt "$cells" ]; then
            echo "::error::incomplete execution evidence: cells=${cells} summaries=${summaries} receipts=${receipts}"
            exit 1
          fi
