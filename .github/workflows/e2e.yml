name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "显式 lane"
        required: true
        type: choice
        options:
          - pr
          - main
          - nightly
          - release
        default: nightly
      repo:
        description: "只跑一个 Repo id（留空=该 lane 全集）"
        required: false
        type: string
      live_providers:
        description: "包含会调用真实公网 provider 的 Repo"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'schedule' }}
  cancel-in-progress: false

jobs:
  e2e-suite:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/e2e-suite.yml
    permissions:
      actions: read
      contents: read
    with:
      lane: ${{ github.event_name == 'schedule' && 'nightly' || inputs.lane }}
      live-providers: ${{ github.event_name == 'schedule' || inputs.live_providers }}
      repo: ${{ inputs.repo || '' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

  nightly-status:
    needs: [e2e-suite]
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (failure() || (success() && (github.event_name == 'schedule'
      || (inputs.lane == 'nightly' && inputs.repo == '' && inputs.live_providers))))
    uses: ./.github/workflows/nightly-status.yml
    permissions:
      issues: write
    with:
      suite: e2e
      failed: ${{ contains(needs.*.result, 'failure') }}
