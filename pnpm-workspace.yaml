# 根 workspace 只管理内部包；E2E 场景与示例各自维持隔离安装身份。
packages:
  - "packages/*"
  - "apps/*"
  - "!e2e/**"
  - "!examples/**"

trustPolicy: off

# Security fixes for transitive dependencies pinned by upstream packages.
overrides:
  'glob@>=9.0.0 <14.0.2': 14.0.2
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
  'dockerode@4>uuid': 11.1.1
  'katex@<0.18.2': 0.18.2
  'undici@>=7.0.0 <7.30.1': 7.30.1

allowBuilds:
  autoevals: false
  '@parcel/watcher': false
  braintrust: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  nx: true
  protobufjs: false
  sharp: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@next/env@16.2.10'
  - '@next/swc-darwin-arm64@16.2.10'
  - '@next/swc-darwin-x64@16.2.10'
  - '@next/swc-linux-arm64-gnu@16.2.10'
  - '@next/swc-linux-arm64-musl@16.2.10'
  - '@next/swc-linux-x64-gnu@16.2.10'
  - '@next/swc-linux-x64-musl@16.2.10'
  - '@next/swc-win32-arm64-msvc@16.2.10'
  - '@next/swc-win32-x64-msvc@16.2.10'
  - next@16.2.10
