# examples/ 不属于本仓库的 monorepo —— 每个 example 是独立 npm 项目(自带 package.json,
# 依赖发布版 niceeval),不作为本 workspace 的成员。
# packages/ 只装内部私有包(当前仅 @niceeval/testkit),不进发布产物;e2e/ 各仓库用自己的
# 空 packages: [] 自成 workspace root,不受本声明影响。
packages:
  - "packages/*"

allowBuilds:
  braintrust: false
  cpu-features: false
  esbuild: false
  protobufjs: false
  sharp: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@next/env@16.2.10'
  - '@next/swc-darwin-arm64@16.2.10'
  - '@next/swc-darwin-x64@16.2.10'
  - '@next/swc-linux-arm64-gnu@16.2.10'
  - '@next/swc-linux-arm64-musl@16.2.10'
  - '@next/swc-linux-x64-gnu@16.2.10'
  - '@next/swc-linux-x64-musl@16.2.10'
  - '@next/swc-win32-arm64-msvc@16.2.10'
  - '@next/swc-win32-x64-msvc@16.2.10'
  - next@16.2.10
